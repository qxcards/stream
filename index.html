<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>QX-cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Rubik:wght@400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Unbounded:wght@400;600;800&family=Russo+One&family=Oswald:wght@400;600;700&family=Comfortaa:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0506;--ink:#fff3ef;--mute:#b99b97;--bd:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05);--red:#ff2d3a;--hot:#ff5a4d;--f:'Onest','Segoe UI',system-ui,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body:not(.ov)::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 8% -6%,rgba(255,45,58,.34),transparent),radial-gradient(520px 380px at 96% 4%,rgba(255,122,61,.2),transparent)}
body.ov{background:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
code{font:500 13px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:7px;word-break:break-all}
:focus-visible{outline:3px solid #ffc46b;outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* общие */
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb1a3,var(--red) 55%,#7a0a14);box-shadow:0 0 18px rgba(255,45,58,.9)}
.logo.big{font-size:34px}.logo.big i{width:32px;height:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;padding:14px 28px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn.p{background:linear-gradient(180deg,#ff5a4d,var(--red));color:#fff;box-shadow:0 10px 34px rgba(255,45,58,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.p:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 42px rgba(255,45,58,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.g{background:var(--glass);border-color:var(--bd)}.btn.g:hover{background:rgba(255,255,255,.1)}
.btn.s{padding:9px 18px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.warn{color:#ffb4a8;font-size:14px}

/* вход */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(460px,100%);text-align:center;padding:42px 32px;border-radius:28px;background:rgba(255,255,255,.04);border:1px solid var(--bd);backdrop-filter:blur(14px);display:grid;gap:18px;justify-items:center}
.login p{color:#d8bcb7}.login small{color:var(--mute);font-size:13px}

/* панель */
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--bd);background:rgba(18,8,10,.6);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.top .usr{margin-left:auto;color:var(--mute);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 22px 80px}
.tabs{display:flex;gap:6px;margin-bottom:22px;padding:5px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);width:fit-content}
.tabs button{border:0;background:none;padding:9px 22px;border-radius:99px;color:var(--mute);font-weight:600;cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#ff5a4d,var(--red));color:#fff}
.panel{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:18px}
.panel h3{font-size:18px;margin-bottom:6px}.panel .hint{color:var(--mute);font-size:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mute);font-weight:500}
.in{width:100%;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--bd);color:var(--ink)}
select.in option{background:#1a0d10}
.copy{display:flex;gap:8px}.copy .in{font:500 13px ui-monospace,Consolas,monospace}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mute);font-weight:500;font-size:13px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;transform:rotate(45deg);margin-right:9px;vertical-align:-1px}

/* коллекция */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1 1 150px;padding:16px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--bd)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
.tile{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:284/408;background:#120a0c;box-shadow:0 0 0 1px var(--rc),0 0 22px var(--rca)}
.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:filter .3s}
.tile.lock{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tile.lock img{filter:grayscale(1) brightness(.2)}
.tile .q{position:absolute;inset:0;display:grid;place-items:center;font:800 44px var(--f);color:rgba(255,255,255,.22)}
.tile .n{position:absolute;top:8px;right:8px;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.72);font-weight:800;font-size:13px}
.tc{margin-top:7px;text-align:center;font-size:13px;color:var(--mute)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.prog .bar{flex:1 1 200px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.prog .bar span{display:block;height:100%;background:linear-gradient(90deg,#ff5a4d,#ffc83a)}
.full{padding:3px 12px;border-radius:99px;background:linear-gradient(90deg,#ffc83a,#ff9466);color:#2a1300;font-weight:800;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--bd);background:var(--glass);border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer}.chip:hover{background:rgba(255,255,255,.1)}
.log{display:grid;gap:6px;font-size:14px;color:#d8bcb7}.log div{display:flex;gap:10px}.log time{color:var(--mute);min-width:44px}

/* оверлей */
#st{position:fixed;left:12px;top:12px;z-index:99;padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.72);font:600 13px var(--f);color:#fff}
#st.bad{background:rgba(180,20,30,.9)}
.stage{position:fixed;left:0;top:0;width:580px;height:780px;z-index:10;pointer-events:none;transform-origin:0 0}
.pack{position:absolute;left:180px;top:330px;width:220px;height:320px;z-index:3;filter:drop-shadow(0 18px 26px rgba(0,0,0,.65))}
.pbody,.ptop{position:absolute;left:0;width:220px}
.ptop{top:0;height:52px;background:linear-gradient(180deg,#5a2aae,#33156b)}
.ptop::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 6px)}
.pbody{top:52px;height:268px;overflow:hidden;background:linear-gradient(160deg,#3a1b78,#160a2c 55%,#3d1248);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.pbody b{font:800 31px/.95 var(--f);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffb6c0);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.pbody small{font:700 11px var(--f);letter-spacing:.18em;color:#d9c4ff;position:relative}
.gems{display:flex;gap:14px;position:relative;margin-bottom:4px}
.gems u{display:block;width:16px;height:16px;border-radius:3px;transform:rotate(45deg);background:var(--g);box-shadow:0 0 14px var(--g)}
.shine{position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);transform:skewX(-18deg);animation:sh 2.2s linear infinite}
@keyframes sh{to{left:140%}}
.card{position:absolute;left:180px;top:330px;width:220px;height:316px;z-index:2;opacity:0;border-radius:14px;overflow:hidden;transform:translateY(20px) scale(.55);box-shadow:0 0 50px var(--rc),0 20px 40px rgba(0,0,0,.6)}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.rays{position:absolute;left:290px;top:250px;width:760px;height:760px;margin:-380px 0 0 -380px;z-index:1;opacity:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--rca) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 66%);mask:radial-gradient(circle,#000 0,transparent 66%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{position:absolute;left:290px;top:490px;width:420px;height:420px;border-radius:50%;z-index:4;opacity:0;background:radial-gradient(circle,#fff 0,var(--rc) 45%,transparent 70%);mix-blend-mode:screen}
.sparks{position:absolute;left:290px;top:250px;width:0;height:0;z-index:4}
.sparks span{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen}
.cap{position:absolute;left:0;right:0;top:664px;text-align:center;z-index:5;opacity:0;text-shadow:0 2px 10px #000,0 0 24px rgba(0,0,0,.85)}
.cap .nm{font:800 30px/1.15 var(--f);overflow-wrap:anywhere}
.cap .rl{font:800 15px var(--f);letter-spacing:.32em}
.cap .sb{font:600 16px var(--f);color:#ffe9e4;margin-top:6px}
.cap .cn{font:600 15px var(--f);color:#ffe9e4;opacity:.85}
.tg{font-weight:800;padding:2px 11px;border-radius:99px;background:rgba(0,0,0,.6)}
.tg.n{color:#7dffa0}.tg.f{color:#ffd45a}.tg.d{color:#ffb7ab}.tg.t{color:#b9b9b9}
.cap .bar{width:220px;height:6px;border-radius:9px;background:rgba(255,255,255,.2);margin:11px auto 0;overflow:hidden}
.cap .bar span{display:block;height:100%;border-radius:9px;background:var(--rc);box-shadow:0 0 12px var(--rc)}

.colbox{position:relative;padding:18px 18px 16px;border-radius:24px;background:linear-gradient(180deg,rgba(28,10,18,var(--bo,.95)),rgba(12,5,10,var(--bo,.95)));border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(255,45,58,.25);text-align:center}
.colbox.full{border-color:#ffc83a;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 50px rgba(255,200,58,.5)}
.colbox .ch{font:800 13px var(--f);letter-spacing:.3em;color:#ff8a7a}.colbox.full .ch{color:#ffc83a}
.colbox .cn2{font:800 30px/1.15 var(--f);overflow-wrap:anywhere;margin:4px 0 10px}
.colbox .cb{height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.colbox .cb span{display:block;height:100%;background:linear-gradient(90deg,#ff5a4d,#ffc83a)}
.colbox .cc{font:700 15px var(--f);margin:8px 0 12px;color:#ffe9e4}
.colbox .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ct{position:relative;aspect-ratio:284/408;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px var(--rc),0 0 14px var(--rca)}
.ct img{width:100%;height:100%;object-fit:cover;display:block}
.ct.lk{box-shadow:0 0 0 1px rgba(255,255,255,.1)}.ct.lk img{filter:grayscale(1) brightness(.2)}
.ct.lk.sr{box-shadow:0 0 0 1px #ff1f3d,0 0 16px rgba(255,31,61,.85),0 0 30px rgba(255,31,61,.45)}.ct.lk.sr img{filter:none;opacity:.8}.ct.lk.sr b{color:rgba(255,255,255,.55);text-shadow:0 0 10px #000,0 0 18px #ff1f3d}
.ct b{position:absolute;inset:0;display:grid;place-items:center;font:800 30px var(--f);color:rgba(255,255,255,.25)}
.ct em{position:absolute;top:4px;right:4px;font:800 12px var(--f);font-style:normal;background:rgba(0,0,0,.78);padding:1px 7px;border-radius:99px}
.stage.wide{width:900px}
.stage.col{height:auto;padding:0 70px}.stage.col.wide{padding:0}
.cpks{display:flex;gap:18px;align-items:flex-start}.cpk{flex:1;min-width:0}
.cph{font:800 12px var(--f);letter-spacing:.16em;color:#ff8a7a;margin:2px 0 9px}
.cg.c5{grid-template-columns:repeat(5,1fr)!important;gap:6px!important}
.colbox .cs2{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:12px;font:700 12px var(--f)}
.pbody,.ptop{background:none!important;overflow:hidden}.pbody{display:block}.ptop::before{display:none}
.pbody img,.ptop img{position:absolute;left:0;width:220px;height:320px;object-fit:contain}.pbody img{top:-52px}.ptop img{top:0}
.tile img,.ct img{object-fit:contain}
/* рулетка */
.rlst{position:fixed;left:0;top:0;width:1120px;z-index:10;pointer-events:none;transform-origin:0 0}
.rlbox{position:relative;padding:18px 0 16px;border-radius:28px;background:linear-gradient(180deg,rgba(30,10,20,var(--bo,.97)),rgba(10,4,9,var(--bo,.97)));border:1px solid rgba(255,255,255,.2);box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 50px var(--rca);text-align:center;overflow:hidden}
.rlh{font:800 14px var(--f);letter-spacing:.32em;color:var(--rc)}
.rlu{font:800 30px/1.2 var(--f);margin:2px 0 10px;text-shadow:0 2px 12px #000}
.rlwin{position:relative;height:262px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.rltrack{position:absolute;left:0;top:0;display:flex;gap:12px;padding:14px 0;will-change:transform}
.rlptr{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 16px #fff,0 0 42px var(--rc);z-index:3}
.rlptr::before,.rlptr::after{content:"";position:absolute;left:-10px;border:12px solid transparent}
.rlptr::before{top:0;border-top-color:#fff;border-bottom:0}
.rlptr::after{bottom:0;border-bottom-color:#fff;border-top:0}
.rlt{flex:0 0 150px;height:234px;border-radius:15px;position:relative;overflow:hidden;background:#120a0c;box-shadow:0 0 0 2px var(--c),0 0 20px var(--ca);display:flex;flex-direction:column}
.rlt img{width:100%;flex:1;min-height:0;object-fit:contain;display:block;background:radial-gradient(circle at 50% 35%,var(--ca),transparent 75%)}
.rlt .l{padding:6px 6px 7px;font:700 13px/1.15 var(--f);text-align:center;background:rgba(0,0,0,.72);color:#fff;overflow-wrap:anywhere}
.rlt .l small{display:block;color:var(--c);font-size:10px;letter-spacing:.14em;margin-bottom:2px}
.rlt.tx{background:radial-gradient(circle at 50% 38%,var(--ca),#120a0c 78%)}
.rlt.tx b{display:grid;place-items:center;flex:1;font:800 62px var(--f);text-shadow:0 0 24px var(--c)}
.rlcap{min-height:58px;margin-top:8px;font:700 18px/1.3 var(--f);opacity:0;text-shadow:0 2px 10px #000}
.rlcap .big{font:800 26px/1.2 var(--f)}
.rlsp{position:absolute;left:50%;top:160px;width:0;height:0;z-index:4}
.rlsp span{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen}
/* рулетка: панель */
.rlp{border-color:var(--rc,rgba(255,255,255,.1))}
.rlp h3{display:flex;align-items:center;gap:10px}
.rlpr{display:grid;grid-template-columns:96px minmax(160px,1fr) 150px 80px 64px 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.rlpr .in{padding:8px 10px}
.rlpr .ty{font-weight:700;font-size:13px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);text-align:center}
.rlpr .pc{font-weight:700;text-align:right;color:#ffd45a}
.rlprev{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.rlprev>div{width:96px;text-align:center}
.rlprev .rlt{flex:none;width:96px;height:146px;border-radius:11px}
.rlprev .rlt .l{font-size:10.5px;padding:4px}.rlprev .rlt .l small{font-size:8px}.rlprev .rlt.tx b{font-size:38px}
.rlprev .tc{margin-top:4px;font-size:12px}
@media(max-width:760px){.rlpr{grid-template-columns:1fr 1fr}}
/* лента «кто что купил» (виджет OBS) */
.feed{position:fixed;left:0;top:0;width:380px;display:grid;gap:8px;z-index:10;pointer-events:none;transform-origin:0 0}
.feed>div{padding:10px 14px;border-radius:14px;background:rgba(10,5,6,var(--bo,.8));border-left:4px solid var(--c);font:700 16px/1.3 var(--f);color:#fff}
.feed small{display:block;color:#d8bcb7;font:500 13px/1.35 var(--f)}
.feed .nw{animation:fi .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes fi{from{opacity:0;transform:translateX(50px)}}
.btb{position:fixed;left:0;top:0;width:400px;display:flex;gap:14px;padding:14px;border-radius:20px;background:rgba(10,5,6,var(--bo,.88));border:1px solid var(--c);z-index:10;pointer-events:none;transform-origin:0 0}
.btb img{width:110px;height:max-content;border-radius:12px;box-shadow:0 0 0 2px var(--c)}
.btb .ai{flex:1;min-width:0;color:#fff;font:600 15px/1.3 var(--f)}
.btb small{display:block;color:var(--c);font:800 11px var(--f);letter-spacing:.14em}
.btb b{display:block;font-size:20px;margin:2px 0 6px;overflow-wrap:anywhere}.btb .at{font:800 30px/1 var(--f);margin-bottom:8px}
.btb ol{list-style:none;padding:0;display:grid;gap:3px;font-size:14px;font-weight:500}
.btb li{display:flex;justify-content:space-between;gap:10px}.btb li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btb li i{font-style:normal;color:#ffc83a;font-weight:700;white-space:nowrap}
.btb .bt-tot{margin-top:8px;color:#d8bcb7;font:600 13px var(--f)}
/* рулетка на баллы: колесо выбывания */
.btst{position:fixed;left:0;top:0;width:1120px;z-index:10;pointer-events:none;transform-origin:0 0}
.btst.nl{width:calc(520px*var(--wh,1) + 90px)}.btst.nl .bts{display:none}
.btbox{position:relative;padding:20px 26px 16px;border-radius:28px;background:linear-gradient(180deg,rgba(30,10,20,var(--bo,.97)),rgba(10,4,9,var(--bo,.97)));border:1px solid rgba(255,255,255,.2);box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 50px var(--rca);text-align:center}
.bth{font:800 14px var(--f);letter-spacing:.32em;color:var(--rc);margin-bottom:14px}
.btmain{display:flex;gap:28px;align-items:center;text-align:left}
.btw{position:relative;width:calc(520px*var(--wh,1));height:calc(520px*var(--wh,1));flex:none}
.btw canvas{width:100%;height:100%;display:block}
.btptr{position:absolute;left:50%;top:-8px;margin-left:-18px;width:0;height:0;border:18px solid transparent;border-top:38px solid #fff;border-bottom:0;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px var(--rc));z-index:3}
.btsp{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4}
.btsp span{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen}
.bts{flex:1;min-width:0}
.btpz{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.btpz img{width:78px;height:max-content;border-radius:10px;box-shadow:0 0 0 2px var(--rc),0 0 18px var(--rca)}
.btpz small{display:block;color:var(--rc);font:800 11px var(--f);letter-spacing:.16em}
.btpz b{font:800 24px/1.15 var(--f);overflow-wrap:anywhere}
.btl{display:grid;gap:5px}
.btr{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.08);font:700 19px/1.2 var(--f);color:#fff}
.btr i{width:12px;height:12px;border-radius:4px;flex:none;background:var(--c)}
.btr .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btr .bs{color:#ffc83a;white-space:nowrap}.btr .bp{min-width:58px;text-align:right;color:#d8bcb7;font-weight:600;font-size:16px}
.btr.out{opacity:.55;background:rgba(255,45,58,.16)}.btr.out .bn{text-decoration:line-through}.btr.out .bs{color:#ff8a7a}
.btr.win{background:linear-gradient(90deg,rgba(255,200,58,.4),rgba(255,200,58,.14));box-shadow:0 0 0 2px #ffc83a}

const SQLTXT="-- QX-cards v14 (v13 + проверка qx_diag; удача показывается только в виджете «Удача»): полная настройка базы (выполнить один раз в SQL Editor → Run, можно повторно)\n--\n-- Что хранится в таблице kv:\n--   kd_<канал>      профили зрителей (карточки, история), журнал паков, лента «кто что купил»\n--   kd_rl_<канал>   призовые рулетки канала (без базы рулетка тоже работает: панель передаёт её в ссылке для OBS)\n--   kd_bt_<канал>   текущая РУЛЕТКА НА БАЛЛЫ: приз, таймер, ставки (ники и баллы) и результат с порядком выбывания\n--   kd_lt_<канал>   ЛОТО: поле ячеек, призы, кто что открыл (отдельный SQL не нужен)\n--   kd_lk_<канал>   УДАЧА: шансы, кто уже использовал награду, последние результаты и id покупок Twitch для возврата баллов (в v12 добавлены функция qx_lk_mark и поля e/r/u/rf/fl в истории)\n--   kd_rf_<канал>   журнал возвратов баллов (кому, за что, забрана ли карточка, убрана ли ставка)\n--   kd_hb_<канал>   «пульс» основной ссылки OBS: пока он свежий, виджеты лото и удачи не открывают своё подключение к Twitch (у Twitch лимит 3 подключения на вход, иначе ошибка 429)\n--   kd_bth_<канал>  история прошедших рулеток на баллы\n--   kd_pend_<канал> призы призовой рулетки, ожидающие подтверждения стримера («Выдать» / «Отклонить»)\n--   kd_tst_<канал>  команда «Тест в OBS» из панели (пак, коллекция, рулетка, рулетка на баллы): в базу карточек и статистику НЕ пишется\n--   kd_tsa_<канал>  ответ OBS «тест получен»: панель показывает «OBS получил ✓»\n--   kd_lay_<канал>  расположение и ВЕСЬ вид виджетов OBS (вкладка «Вид в OBS»: место, размер блока, колеса и текста, цвет и прозрачность фона, рамка, скругление, тень, свечение, размытие, шрифт, цвета текста и указателя,\n--                   скрытие заголовка/ника/приза/процентов/подписи, длительность прокрута и время показа результата призовой рулетки). OBS подхватывает за пару секунд\n--   kd_lp_<канал>   «Мои стили» вида виджетов (кнопка «Сохранить как мой стиль»)\n--\n-- Аукцион удалён: старые функции qx_bid / qx_au_* и данные kd_au_* больше не нужны (данные можно оставить, они ни на что не влияют).\n--\n-- Функции qx_* делают все изменения атомарно (с блокировкой строки):\n-- две покупки или ставки одновременно не затирают друг друга.\n\ncreate table if not exists public.kv (\n  key text primary key,\n  value jsonb not null default jsonb_build_object(),\n  updated_at timestamptz not null default now()\n);\n\ncreate or replace function public.kv_touch() returns trigger\nlanguage plpgsql as $$\nbegin new.updated_at = now(); return new; end $$;\n\ndrop trigger if exists kv_touch on public.kv;\ncreate trigger kv_touch before insert or update on public.kv\nfor each row execute function public.kv_touch();\n\nalter table public.kv enable row level security;\ndrop policy if exists \"kv all\" on public.kv;\ncreate policy \"kv all\" on public.kv for all to anon, authenticated\nusing (true) with check (true);\n\ngrant usage on schema public to anon, authenticated;\ngrant select, insert, update, delete on public.kv to anon, authenticated;\n\ncreate index if not exists kv_key_prefix on public.kv (key text_pattern_ops);\n\n-- ---------- убрать устаревшее (аукцион) ----------\n\ndrop function if exists public.qx_bid(text, text, text, text, text, int);\ndrop function if exists public.qx_au_extend(text, bigint);\ndrop function if exists public.qx_au_finish(text, jsonb);\n\n-- ---------- вспомогательные ----------\n\ncreate or replace function public.qx_now_ms() returns bigint\nlanguage sql as $$ select (extract(epoch from clock_timestamp()) * 1000)::bigint $$;\n\n-- добавить элемент в начало массива и оставить не больше n штук\ncreate or replace function public.qx_prepend(arr jsonb, item jsonb, n int) returns jsonb\nlanguage sql as $$\n  select coalesce(jsonb_agg(e order by o), '[]'::jsonb)\n  from (\n    select e, o from jsonb_array_elements(\n      jsonb_build_array(jsonb_build_object('t', public.qx_now_ms()) || item)\n      || (case when jsonb_typeof(arr) = 'array' then arr else '[]'::jsonb end)\n    ) with ordinality as t(e, o)\n    order by o limit n\n  ) s\n$$;\n\n-- проверка связи: версия SQL и время сервера (по нему считаются таймеры, чтобы не зависеть от часов компьютера)\ncreate or replace function public.qx_ping() returns jsonb\nlanguage sql as $$ select jsonb_build_object('ok', true, 'v', 14, 'now', public.qx_now_ms()) $$;\n\n-- ---------- выдать карточку зрителю (и записать в журналы) ----------\n-- p_card = null: только записать в ленту/журнал (приз без карточки)\n\ncreate or replace function public.qx_grant(\n  p_ch text, p_id text, p_login text, p_name text,\n  p_card int default null, p_total boolean default true,\n  p_buy jsonb default null, p_rl jsonb default null\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_' || p_ch;\n  d jsonb;\n  u jsonb;\n  prev int := 0;\nbegin\n  insert into public.kv(key, value) values (k, '{}'::jsonb) on conflict (key) do nothing;\n  select value into d from public.kv where key = k for update;\n  if d is null or jsonb_typeof(d) <> 'object' then d := '{}'::jsonb; end if;\n  d := jsonb_set(d, '{v}', coalesce(d->'v', '{}'::jsonb));\n  d := jsonb_set(d, '{g}', coalesce(d->'g', '{}'::jsonb));\n\n  if p_card is not null then\n    u := d->'v'->p_id;\n    -- профиль, созданный по нику, переезжает на постоянный id Twitch\n    if u is null and p_login is not null and p_login <> p_id and (d->'v') ? p_login then\n      u := d->'v'->p_login;\n      d := jsonb_set(d, '{v}', (d->'v') - p_login);\n    end if;\n    u := coalesce(u, '{}'::jsonb);\n    u := jsonb_set(u, '{c}', coalesce(u->'c', '{}'::jsonb));\n    prev := coalesce((u->'c'->>(p_card::text))::int, 0);\n    u := jsonb_set(u, array['c', p_card::text], to_jsonb(prev + 1), true);\n    u := u || jsonb_build_object('n', p_name, 'l', p_login);\n    if p_buy is not null then\n      u := jsonb_set(u, '{h}', public.qx_prepend(u->'h',\n             jsonb_build_object('w', p_buy->>'w', 'p', p_buy->>'p'), 30));\n    end if;\n    d := jsonb_set(d, array['v', p_id], u, true);\n    d := jsonb_set(d, array['g', p_card::text],\n           to_jsonb(coalesce((d->'g'->>(p_card::text))::int, 0) + 1), true);\n    if p_total then\n      d := jsonb_set(d, '{total}', to_jsonb(coalesce((d->>'total')::int, 0) + 1), true);\n    end if;\n    d := jsonb_set(d, '{log}', public.qx_prepend(d->'log',\n           jsonb_build_object('l', p_login, 'n', p_name, 'c', p_card), 40), true);\n  end if;\n\n  if p_buy is not null then\n    d := jsonb_set(d, '{buy}', public.qx_prepend(d->'buy', p_buy, 60), true);\n  end if;\n  if p_rl is not null then\n    d := jsonb_set(d, '{rl}', public.qx_prepend(d->'rl', p_rl, 60), true);\n  end if;\n\n  update public.kv set value = d where key = k;\n  return jsonb_build_object('prev', prev, 'c', coalesce(u->'c', '{}'::jsonb));\nend $$;\n\n-- ================= РУЛЕТКА НА БАЛЛЫ =================\n-- Приз (карточка или случайная карточка из пака), таймер, ставки зрителей (ник + баллы канала).\n-- Когда время вышло, рулетка крутится на выбывание: колесо по очереди выбивает участников, остаётся победитель.\n-- Время начала и конца считает сервер.\n\n-- запустить раунд (заменяет предыдущий)\ncreate or replace function public.qx_bet_start(\n  p_ch text, p_card int, p_pk text, p_title text, p_mode text,\n  p_ms bigint, p_secs int, p_auto boolean\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  ts bigint := public.qx_now_ms();\n  a jsonb;\nbegin\n  if p_ms is null or p_ms <= 0 then raise exception 'Поставьте таймер: часы или минуты'; end if;\n  if p_card is null and coalesce(p_pk, '') = '' then raise exception 'Не выбран приз'; end if;\n  a := jsonb_build_object(\n    'card', p_card, 'pk', nullif(p_pk, ''),\n    'title', lower(coalesce(nullif(trim(p_title), ''), 'ставка')),\n    'mode', case when p_mode = 'max' then 'max' else 'roll' end,\n    'start', ts, 'end', ts + p_ms,\n    'secs', greatest(5, least(coalesce(p_secs, 30), 1800)),\n    'auto', coalesce(p_auto, false),\n    'status', 'run', 'bids', '{}'::jsonb, 'seen', '[]'::jsonb, 'h', '[]'::jsonb,\n    'winner', null, 'spin', null, 'v', 6);\n  insert into public.kv as kv(key, value) values ('kd_bt_' || p_ch, a)\n  on conflict (key) do update set value = excluded.value;\n  return a;\nend $$;\n\n-- ставка (баллы суммируются, повтор события игнорируется)\ncreate or replace function public.qx_bet(\n  p_ch text, p_event text, p_id text, p_login text, p_name text, p_amount int\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_bt_' || p_ch;\n  a jsonb;\n  b jsonb;\n  ts bigint := public.qx_now_ms();\nbegin\n  if p_amount is null or p_amount < 1 then\n    return jsonb_build_object('ok', false, 'why', 'amount');\n  end if;\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object'\n     or coalesce(a->>'status', '') <> 'run'\n     or coalesce((a->>'end')::bigint, 0) + 3000 < ts then\n    return jsonb_build_object('ok', false, 'why', 'closed');\n  end if;\n  if p_event is not null and coalesce(a->'seen', '[]'::jsonb) ? p_event then\n    return jsonb_build_object('ok', false, 'why', 'dup');\n  end if;\n\n  a := jsonb_set(a, '{bids}', coalesce(a->'bids', '{}'::jsonb));\n  b := coalesce(a->'bids'->p_id, jsonb_build_object('n', p_name, 'l', p_login, 's', 0));\n  b := b || jsonb_build_object('n', p_name, 'l', p_login,\n                               's', coalesce((b->>'s')::int, 0) + p_amount);\n  a := jsonb_set(a, array['bids', p_id], b, true);\n  -- запоминаем, какая ставка пришла с какой покупкой Twitch: это нужно, чтобы убрать её при возврате баллов\n  a := jsonb_set(a, '{evs}', coalesce(a->'evs', '{}'::jsonb), true);\n  if p_event is not null and p_event <> '' then\n    a := jsonb_set(a, array['evs', p_event], jsonb_build_object('u', p_id, 's', p_amount), true);\n  end if;\n\n  a := jsonb_set(a, '{seen}', (\n    select coalesce(jsonb_agg(e order by o), '[]'::jsonb) from (\n      select e, o from jsonb_array_elements(\n        coalesce(a->'seen', '[]'::jsonb) || to_jsonb(coalesce(p_event, ''))\n      ) with ordinality as t(e, o)\n      order by o desc limit 200\n    ) s\n  ), true);\n  a := jsonb_set(a, '{h}', public.qx_prepend(a->'h',\n         jsonb_build_object('n', p_name, 's', p_amount), 100), true);\n\n  update public.kv set value = a where key = k;\n  return jsonb_build_object('ok', true, 'total', (b->>'s')::int);\nend $$;\n\n-- продлить таймер\ncreate or replace function public.qx_bet_extend(p_ch text, p_ms bigint) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_bt_' || p_ch;\n  a jsonb;\n  ts bigint := public.qx_now_ms();\nbegin\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object' or coalesce(a->>'status', '') <> 'run' then\n    raise exception 'Рулетка не идёт';\n  end if;\n  a := jsonb_set(a, '{end}', to_jsonb(greatest((a->>'end')::bigint, ts) + p_ms));\n  update public.kv set value = a where key = k;\n  return a;\nend $$;\n\n-- поменять способ запуска и длительность прокрута у идущей рулетки (p_auto: крутить само по таймеру или вручную, p_secs: сколько секунд крутится)\ncreate or replace function public.qx_bet_set(p_ch text, p_auto boolean, p_secs int) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_bt_' || p_ch;\n  a jsonb;\nbegin\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object' or coalesce(a->>'status', '') <> 'run' then\n    raise exception 'Рулетка не идёт';\n  end if;\n  a := a || jsonb_build_object(\n    'auto', coalesce(p_auto, coalesce((a->>'auto')::boolean, false)),\n    'secs', greatest(5, least(coalesce(p_secs, (a->>'secs')::int, 30), 1800)));\n  update public.kv set value = a where key = k;\n  return a;\nend $$;\n\n-- отменить рулетку (ставки пропадают, баллы зрителям Twitch не возвращает)\ncreate or replace function public.qx_bet_cancel(p_ch text) returns jsonb\nlanguage plpgsql as $$\nbegin\n  update public.kv set value = '{}'::jsonb where key = 'kd_bt_' || p_ch;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- крутить: выбрать победителя и порядок выбывания, выдать карточку победителю, записать историю\n-- mode = roll: шанс победы пропорционален ставке; mode = max: побеждает самая большая ставка\n-- p_card: карточка, выбранная заранее (для приза «случайная карточка из пака»); иначе берётся из раунда\ncreate or replace function public.qx_bet_finish(\n  p_ch text, p_card int default null, p_buy jsonb default '{}'::jsonb\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_bt_' || p_ch;\n  hk text := 'kd_bth_' || p_ch;\n  a jsonb; ps jsonb; ord jsonb := '[]'::jsonb; sp jsonb; h jsonb;\n  cnt int; wi int := 0; i int; pick int; cur int;\n  tot numeric; t numeric; r numeric; w numeric; mn numeric;\n  card int; mode text; ws int;\n  rem int[];\n  ts bigint := public.qx_now_ms();\nbegin\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object' or a->>'status' is null then\n    raise exception 'Рулетка не запущена';\n  end if;\n  if a->>'status' = 'done' then\n    raise exception 'Рулетка уже разыграна';\n  end if;\n  card := coalesce(p_card, (a->>'card')::int);\n  if card is null then raise exception 'Не выбрана карточка'; end if;\n  mode := coalesce(a->>'mode', 'roll');\n\n  select coalesce(jsonb_agg(jsonb_build_object('k', e.key, 'n', e.value->>'n', 'l', e.value->>'l',\n                                               's', (e.value->>'s')::int) order by e.key), '[]'::jsonb)\n  into ps\n  from jsonb_each(coalesce(a->'bids', '{}'::jsonb)) e\n  where (e.value->>'s')::numeric > 0;\n  cnt := jsonb_array_length(ps);\n  if cnt = 0 then raise exception 'Ставок нет — разыгрывать не из кого'; end if;\n  select coalesce(sum((x->>'s')::numeric), 0) into tot from jsonb_array_elements(ps) x;\n\n  -- победитель\n  if mode = 'roll' then\n    r := random() * tot;\n    wi := cnt - 1;\n    for i in 0 .. cnt - 1 loop\n      w := (ps->i->>'s')::numeric;\n      if r < w then wi := i; exit; end if;\n      r := r - w;\n    end loop;\n  else\n    select (o - 1)::int into wi\n    from jsonb_array_elements(ps) with ordinality t(e, o)\n    order by (e->>'s')::numeric desc, random() limit 1;\n  end if;\n  ws := (ps->wi->>'s')::int;\n\n  -- порядок выбывания остальных (f — куда попадёт указатель внутри сектора, 0..1)\n  rem := array(select g from generate_series(0, cnt - 1) g where g <> wi);\n  while coalesce(array_length(rem, 1), 0) > 0 loop\n    pick := rem[1];\n    if mode = 'roll' then\n      t := 0;\n      foreach cur in array rem loop t := t + (ps->cur->>'s')::numeric; end loop;\n      r := random() * t;\n      foreach cur in array rem loop\n        w := (ps->cur->>'s')::numeric;\n        pick := cur;\n        exit when r < w;\n        r := r - w;\n      end loop;\n    else\n      mn := null;\n      foreach cur in array rem loop\n        w := (ps->cur->>'s')::numeric + random() * 0.001;\n        if mn is null or w < mn then mn := w; pick := cur; end if;\n      end loop;\n    end if;\n    ord := ord || jsonb_build_array(jsonb_build_object(\n             'n', ps->pick->>'n', 's', (ps->pick->>'s')::int,\n             'f', round((0.15 + random() * 0.7)::numeric, 3)));\n    rem := array_remove(rem, pick);\n  end loop;\n\n  sp := jsonb_build_object(\n    'id', 'b' || ts::text, 't', ts, 'card', card, 'mode', mode,\n    'secs', coalesce((a->>'secs')::int, 30),\n    'list', (select coalesce(jsonb_agg(jsonb_build_object('n', x->>'n', 's', (x->>'s')::int)\n                                       order by (x->>'s')::int desc), '[]'::jsonb)\n             from jsonb_array_elements(ps) x),\n    'win', jsonb_build_object('n', ps->wi->>'n', 's', ws),\n    'order', ord);\n\n  perform public.qx_grant(p_ch, ps->wi->>'k', ps->wi->>'l', ps->wi->>'n', card, false,\n    jsonb_build_object('n', ps->wi->>'n', 'w', coalesce(p_buy->>'w', 'Рулетка на баллы'),\n                       'p', coalesce(p_buy->>'p', '') || ' за ' || ws::text || ' б.',\n                       'c', p_buy->>'c'),\n    null);\n\n  a := a || jsonb_build_object('status', 'done', 'card', card, 'spin', sp,\n                               'winner', jsonb_build_object('n', ps->wi->>'n', 's', ws),\n                               'end', least(coalesce((a->>'end')::bigint, ts), ts));\n  update public.kv set value = a where key = k;\n\n  h := jsonb_build_object('t', ts, 'card', card, 'cn', p_buy->>'p', 'win', ps->wi->>'n', 's', ws,\n         'mode', mode, 'n', cnt, 'list', sp->'list');\n  insert into public.kv as kv(key, value)\n  values (hk, jsonb_build_object('list', jsonb_build_array(h)))\n  on conflict (key) do update\n    set value = jsonb_build_object('list',\n      public.qx_prepend(coalesce(kv.value->'list', '[]'::jsonb), excluded.value->'list'->0, 50));\n\n  return sp;\nend $$;\n\n-- ---------- призы призовой рулетки на ручном подтверждении ----------\n-- добавить приз в очередь ожидания (атомарно)\n\ncreate or replace function public.qx_pend_add(p_ch text, p_item jsonb) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_pend_' || p_ch;\n  d jsonb;\nbegin\n  insert into public.kv(key, value) values (k, jsonb_build_object('list', '[]'::jsonb))\n  on conflict (key) do nothing;\n  select value into d from public.kv where key = k for update;\n  d := jsonb_build_object('list',\n         public.qx_prepend(coalesce(d->'list', '[]'::jsonb), p_item, 100));\n  update public.kv set value = d where key = k;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- забрать приз из очереди по id (выдать или отклонить): возвращает приз или null, если его уже забрали\n\ncreate or replace function public.qx_pend_take(p_ch text, p_id text) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_pend_' || p_ch;\n  d jsonb;\n  item jsonb;\nbegin\n  select value into d from public.kv where key = k for update;\n  if d is null or jsonb_typeof(d->'list') <> 'array' then\n    return null;\n  end if;\n  select e into item\n  from jsonb_array_elements(d->'list') e\n  where e->>'id' = p_id\n  limit 1;\n  if item is null then\n    return null;\n  end if;\n  update public.kv set value = jsonb_build_object('list',\n    coalesce((\n      select jsonb_agg(e order by o)\n      from jsonb_array_elements(d->'list') with ordinality as t(e, o)\n      where e->>'id' <> p_id\n    ), '[]'::jsonb))\n  where key = k;\n  return item;\nend $$;\n\ngrant execute on all functions in schema public to anon, authenticated;\n\n-- ================= ТОП ПО КАРТОЧКАМ (расширение Twitch) =================\n-- все зрители канала с местом в рейтинге\n-- p_by = 'total' (по общему числу карточек) или 'unique' (по числу разных)\ncreate or replace function public.qx_top_rows(p_ch text, p_by text default 'total')\nreturns table (rk bigint, id text, n text, l text, total int, uniq int)\nlanguage sql stable as $$\n  with src as (\n    select case when jsonb_typeof(value->'v') = 'object' then value->'v' else '{}'::jsonb end as v\n    from public.kv where key = 'kd_' || lower(coalesce(p_ch, ''))\n  ),\n  u as (\n    select e.key as id, e.value->>'n' as n, e.value->>'l' as l,\n      (select coalesce(sum(case when (c.value #>> '{}') ~ '^[0-9]+$' then (c.value #>> '{}')::int else 0 end), 0)\n         from jsonb_each(case when jsonb_typeof(e.value->'c') = 'object' then e.value->'c' else '{}'::jsonb end) c)::int as total,\n      (select count(*) filter (where (c.value #>> '{}') ~ '^[0-9]+$' and (c.value #>> '{}')::int > 0)\n         from jsonb_each(case when jsonb_typeof(e.value->'c') = 'object' then e.value->'c' else '{}'::jsonb end) c)::int as uniq\n    from src, jsonb_each(src.v) e\n    where jsonb_typeof(e.value) = 'object'\n  )\n  select row_number() over (\n           order by case when p_by = 'unique' then u.uniq else u.total end desc,\n                    case when p_by = 'unique' then u.total else u.uniq end desc,\n                    lower(coalesce(u.n, u.l, u.id)))::bigint as rk,\n         u.id, coalesce(u.n, u.l, u.id) as n, u.l, u.total, u.uniq\n  from u\n  where u.total > 0\n$$;\n\n-- топ канала: p_limit мест (1..100) + общие цифры\ncreate or replace function public.qx_top(p_ch text, p_limit int default 20, p_by text default 'total')\nreturns jsonb\nlanguage sql stable as $$\n  with r as (select * from public.qx_top_rows(p_ch, p_by))\n  select jsonb_build_object(\n    'by', case when p_by = 'unique' then 'unique' else 'total' end,\n    'players', (select count(*) from r),\n    'cards', (select coalesce(sum(total), 0) from r),\n    'list', coalesce((\n      select jsonb_agg(jsonb_build_object('rk', rk, 'n', n, 'l', l, 'total', total, 'uniq', uniq) order by rk)\n      from r where rk <= least(greatest(coalesce(p_limit, 20), 1), 100)\n    ), '[]'::jsonb))\n$$;\n\n-- место одного зрителя по нику (логин или отображаемое имя, без учёта регистра); null, если карточек нет\ncreate or replace function public.qx_rank(p_ch text, p_name text, p_by text default 'total')\nreturns jsonb\nlanguage sql stable as $$\n  select (\n    select jsonb_build_object('rk', rk, 'n', n, 'l', l, 'total', total, 'uniq', uniq,\n                              'players', (select count(*) from public.qx_top_rows(p_ch, p_by)))\n    from public.qx_top_rows(p_ch, p_by)\n    where lower(coalesce(l, '')) = lower(trim(coalesce(p_name, '')))\n       or lower(n) = lower(trim(coalesce(p_name, '')))\n    order by rk limit 1)\n$$;\n\ngrant execute on function public.qx_top_rows(text, text) to anon, authenticated;\ngrant execute on function public.qx_top(text, int, text) to anon, authenticated;\ngrant execute on function public.qx_rank(text, text, text) to anon, authenticated;\n\ngrant execute on all functions in schema public to anon, authenticated;\n\n-- ================= ВОЗВРАТ БАЛЛОВ ЗА «УДАЧУ» (v12) =================\n-- Баллы возвращает сам Twitch (панель шлёт ему CANCELED по выбору стримера). Эта функция только отмечает это в базе:\n--   p_eids  — JSON-массив id покупок Twitch (поле e в истории удачи), например '[\"abc\",\"def\"]'\n--   p_state — 'refund' (баллы возвращены: в истории пометка rf, а при p_reset=true зритель снова может использовать награду)\n--             или 'done' (покупка засчитана и закрыта в очереди Twitch: пометка fl)\n-- Всё делается под блокировкой строки, поэтому одновременная покупка зрителя не затирается.\n\ncreate or replace function public.qx_lk_mark(\n  p_ch text, p_eids jsonb, p_state text default 'refund', p_reset boolean default true\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_lk_' || p_ch;\n  a jsonb;\n  ids text[];\n  uids text[];\n  cnt int := 0;\nbegin\n  if p_eids is null or jsonb_typeof(p_eids) <> 'array' then\n    return jsonb_build_object('ok', false, 'why', 'eids');\n  end if;\n  ids := array(select jsonb_array_elements_text(p_eids));\n\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object' or jsonb_typeof(a->'h') <> 'array' then\n    return jsonb_build_object('ok', false, 'why', 'none');\n  end if;\n\n  select count(*)::int into cnt\n  from jsonb_array_elements(a->'h') e\n  where (e->>'e') = any(ids)\n    and not coalesce((e->>'rf')::boolean, false);\n\n  if p_state = 'refund' and coalesce(p_reset, false) and jsonb_typeof(a->'used') = 'object' then\n    uids := array(\n      select distinct e->>'u'\n      from jsonb_array_elements(a->'h') e\n      where (e->>'e') = any(ids)\n        and not coalesce((e->>'rf')::boolean, false)\n        and (e->>'res') in ('fail', 'common', 'rare')\n        and (e->>'u') is not null\n    );\n    a := jsonb_set(a, '{used}', coalesce((\n      select jsonb_object_agg(u.key, u.value)\n      from jsonb_each(a->'used') u\n      where not (u.key = any(uids))\n    ), '{}'::jsonb));\n  end if;\n\n  a := jsonb_set(a, '{h}', coalesce((\n    select jsonb_agg(\n      case\n        when (e->>'e') = any(ids) and not coalesce((e->>'rf')::boolean, false)\n          then e || (case when p_state = 'done'\n                          then jsonb_build_object('fl', true)\n                          else jsonb_build_object('rf', true) end)\n        else e\n      end order by o)\n    from jsonb_array_elements(a->'h') with ordinality as t(e, o)\n  ), '[]'::jsonb));\n\n  a := jsonb_set(a, '{rev}', to_jsonb(coalesce((a->>'rev')::bigint, 0) + 1));\n  update public.kv set value = a where key = k;\n  return jsonb_build_object('ok', true, 'n', cnt);\nend $$;\n\n\n-- ================= ВОЗВРАТ БАЛЛОВ ЗА ЛЮБЫЕ НАГРАДЫ (v13) =================\n-- Баллы возвращает сам Twitch (панель шлёт ему CANCELED по выбору стримера). Функции ниже по желанию откатывают последствия покупки.\n\n-- убрать ставку из идущей рулетки на баллы (по id покупки Twitch)\ncreate or replace function public.qx_bet_unbid(p_ch text, p_event text) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_bt_' || p_ch;\n  a jsonb; e jsonb; b jsonb; ns int;\nbegin\n  select value into a from public.kv where key = k for update;\n  if a is null or jsonb_typeof(a) <> 'object' or coalesce(a->>'status', '') <> 'run' then\n    return jsonb_build_object('ok', false, 'why', 'closed');\n  end if;\n  e := a->'evs'->p_event;\n  if e is null then return jsonb_build_object('ok', false, 'why', 'nobet'); end if;\n  b := a->'bids'->(e->>'u');\n  if b is null then return jsonb_build_object('ok', false, 'why', 'nobet'); end if;\n  ns := coalesce((b->>'s')::int, 0) - coalesce((e->>'s')::int, 0);\n  if ns <= 0 then\n    a := jsonb_set(a, '{bids}', (a->'bids') - (e->>'u'));\n  else\n    a := jsonb_set(a, array['bids', e->>'u'], b || jsonb_build_object('s', ns));\n  end if;\n  a := jsonb_set(a, '{evs}', (a->'evs') - p_event);\n  update public.kv set value = a where key = k;\n  return jsonb_build_object('ok', true, 'left', greatest(ns, 0));\nend $$;\n\n-- забрать у зрителя одну карточку (не меньше нуля)\ncreate or replace function public.qx_take(p_ch text, p_id text, p_card int, p_total boolean default false) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_' || p_ch;\n  d jsonb; u jsonb; n int;\nbegin\n  select value into d from public.kv where key = k for update;\n  if d is null or jsonb_typeof(d->'v') <> 'object' then return jsonb_build_object('ok', false); end if;\n  u := d->'v'->p_id;\n  if u is null or jsonb_typeof(u->'c') <> 'object' then return jsonb_build_object('ok', false); end if;\n  n := coalesce((u->'c'->>(p_card::text))::int, 0);\n  if n <= 0 then return jsonb_build_object('ok', false); end if;\n  if n = 1 then\n    u := jsonb_set(u, '{c}', (u->'c') - (p_card::text));\n  else\n    u := jsonb_set(u, array['c', p_card::text], to_jsonb(n - 1));\n  end if;\n  d := jsonb_set(d, array['v', p_id], u, true);\n  if (d->'g'->>(p_card::text)) is not null then\n    d := jsonb_set(d, array['g', p_card::text], to_jsonb(greatest(coalesce((d->'g'->>(p_card::text))::int, 0) - 1, 0)), true);\n  end if;\n  if p_total then\n    d := jsonb_set(d, '{total}', to_jsonb(greatest(coalesce((d->>'total')::int, 0) - 1, 0)), true);\n  end if;\n  update public.kv set value = d where key = k;\n  return jsonb_build_object('ok', true, 'left', n - 1);\nend $$;\n\n-- откат последствий возврата: p_eids — id покупок Twitch (JSON-массив)\n--   p_bet  = true: убрать ставку из идущей рулетки на баллы\n--   p_take = true: забрать у зрителя карточку, выданную за эту покупку (пак, рулетка, лото, удача)\ncreate or replace function public.qx_rd_undo(\n  p_ch text, p_eids jsonb, p_take boolean default false, p_bet boolean default true\n) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_' || p_ch;\n  eid text; it jsonb; d jsonb; r jsonb; tot boolean;\n  took int := 0; unb int := 0;\nbegin\n  if p_eids is null or jsonb_typeof(p_eids) <> 'array' then\n    return jsonb_build_object('ok', false, 'why', 'eids');\n  end if;\n  for eid in select jsonb_array_elements_text(p_eids) loop\n    if coalesce(p_bet, true) then\n      r := public.qx_bet_unbid(p_ch, eid);\n      if coalesce((r->>'ok')::boolean, false) then unb := unb + 1; end if;\n    end if;\n    if coalesce(p_take, false) then\n      select value into d from public.kv where key = k;\n      if d is not null and jsonb_typeof(d->'buy') = 'array' then\n        for it in\n          select e from jsonb_array_elements(d->'buy') e\n          where e->>'e' = eid and (e->>'cd') is not null and (e->>'u') is not null\n            and not coalesce((e->>'rv')::boolean, false)\n        loop\n          tot := not (coalesce(it->>'w', '') like 'Лото%' or coalesce(it->>'w', '') = 'Удача'\n                      or coalesce(it->>'w', '') like 'Рулетка на баллы%');\n          r := public.qx_take(p_ch, it->>'u', (it->>'cd')::int, tot);\n          if coalesce((r->>'ok')::boolean, false) then took := took + 1; end if;\n        end loop;\n        update public.kv set value = jsonb_set(value, '{buy}', coalesce((\n          select jsonb_agg(case when e->>'e' = eid then e || jsonb_build_object('rv', true) else e end order by o)\n          from jsonb_array_elements(value->'buy') with ordinality as t(e, o)\n        ), '[]'::jsonb)) where key = k;\n      end if;\n    end if;\n  end loop;\n  return jsonb_build_object('ok', true, 'took', took, 'unb', unb);\nend $$;\n\n-- журнал возвратов (последние 100)\ncreate or replace function public.qx_rf_add(p_ch text, p_item jsonb) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  k text := 'kd_rf_' || p_ch;\n  d jsonb;\nbegin\n  insert into public.kv(key, value) values (k, jsonb_build_object('list', '[]'::jsonb))\n  on conflict (key) do nothing;\n  select value into d from public.kv where key = k for update;\n  d := jsonb_build_object('list', public.qx_prepend(coalesce(d->'list', '[]'::jsonb), p_item, 100));\n  update public.kv set value = d where key = k;\n  return jsonb_build_object('ok', true);\nend $$;\n\n\n-- ================= ПРОВЕРКА СОСТОЯНИЯ (v14) =================\n-- Запустите в SQL Editor:  select public.qx_diag('quddix');\n-- Покажет, видит ли база лото, удачу и «пульс» основной ссылки OBS, и подскажет, что не так, если награды за баллы не засчитываются.\ncreate or replace function public.qx_diag(p_ch text) returns jsonb\nlanguage plpgsql as $$\ndeclare\n  lk jsonb; lt jsonb; hb jsonb; bt jsonb;\n  age bigint; tips jsonb := '[]'::jsonb;\nbegin\n  select value into lk from public.kv where key = 'kd_lk_' || p_ch;\n  select value into lt from public.kv where key = 'kd_lt_' || p_ch;\n  select value into bt from public.kv where key = 'kd_bt_' || p_ch;\n  select value into hb from public.kv where key = 'kd_hb_' || p_ch;\n  age := case when hb is null or hb->>'t' is null then null\n              else public.qx_now_ms() - (hb->>'t')::bigint end;\n\n  if lk is null or lk->>'title' is null then\n    tips := tips || to_jsonb('Удача не настроена: в панели на вкладке «Удача» нажмите «Сохранить и включить»'::text);\n  elsif not coalesce((lk->>'on')::boolean, false) then\n    tips := tips || to_jsonb('Удача выключена: нажмите «Сохранить и включить» в панели'::text);\n  end if;\n  if lt is not null and lt->>'status' = 'done' then\n    tips := tips || to_jsonb('Лото завершено: для новых покупок запустите новое лото'::text);\n  elsif lt is null or lt->>'title' is null then\n    tips := tips || to_jsonb('Лото не запущено: нажмите «Запустить лото» в панели'::text);\n  end if;\n  if age is null then\n    tips := tips || to_jsonb('Основная ссылка OBS ещё не выходила на связь: добавьте её в OBS (копия ссылки из панели)'::text);\n  elsif age > 75000 then\n    tips := tips || to_jsonb('Основная ссылка OBS молчит больше минуты: проверьте, что источник в OBS включён и нет ошибки 429 (лимит 3 подключения Twitch)'::text);\n  end if;\n\n  return jsonb_build_object(\n    'ok', true,\n    'version', 11,\n    'luck', case when lk is null then null else jsonb_build_object(\n      'title', lk->>'title', 'on', lk->>'on', 'once', lk->>'once',\n      'used', (select count(*) from jsonb_object_keys(coalesce(lk->'used', '{}'::jsonb))),\n      'last', lk->'last', 'history', jsonb_array_length(coalesce(lk->'h', '[]'::jsonb))) end,\n    'lotto', case when lt is null then null else jsonb_build_object(\n      'title', lt->>'title', 'status', lt->>'status', 'cells', lt->>'n',\n      'opened', (select count(*) from jsonb_object_keys(coalesce(lt->'cells', '{}'::jsonb)))) end,\n    'bet', case when bt is null then null else jsonb_build_object('status', bt->>'status', 'title', bt->>'title') end,\n    'obs_main_ping_ms_ago', age,\n    'tips', tips);\nend $$;\n\ngrant execute on all functions in schema public to anon, authenticated;\n";

function layCalc(L,w,h,vw,vh){
  const s=Math.min((L.s||1)*vw/1920,(vw-8)/w,(vh-8)/h),bw=w*s,bh=h*s;let x,y;

function layFit(el){

function listen(tok,info,onRedeem,onStatus){
  let ws,wd,dead=false,ka=10,slow=false,slowN=0;const seen=new Set();
  const arm=()=>{clearTimeout(wd);wd=setTimeout(()=>{try{ws.close()}catch(e){}},(ka+8)*1000)};
  async function sub(sid){
    const r=await fetch('https://api.twitch.tv/helix/eventsub/subscriptions',{method:'POST',headers:{'Client-Id':info.client_id,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({type:'channel.channel_points_custom_reward_redemption.add',version:'1',condition:{broadcaster_user_id:info.user_id},transport:{method:'websocket',session_id:sid}})});
    return r.status;
  }
  function open(url,re){
    const sock=new WebSocket(url);ws=sock;
    sock.onmessage=async ev=>{
      const m=JSON.parse(ev.data),t=m.metadata.message_type;arm();
      if(t==='session_welcome'){ka=m.payload.session.keepalive_timeout_seconds||10;arm();if(!re){const c=await sub(m.payload.session.id);slow=(c===429);slowN=slow?slowN+1:0;onStatus('sub',c);if(slow){try{sock.close()}catch(e){}}}}
      else if(t==='session_reconnect'){open(m.payload.session.reconnect_url,true);setTimeout(()=>{try{sock.close()}catch(e){}},1500)}
      else if(t==='notification'){if(seen.has(m.metadata.message_id))return;seen.add(m.metadata.message_id);onRedeem(m.payload.event)}
      else if(t==='revocation'){onStatus('revoked')}
    };
    sock.onclose=()=>{if(dead||ws!==sock)return;onStatus(slow?'limit':'retry');setTimeout(()=>open('wss://eventsub.wss.twitch.tv/ws',false),slow?Math.min(20000*slowN,120000):3000)};
  }

  return ()=>{dead=true;clearTimeout(wd);try{ws.close()}catch(e){}};
}

async function handleCol(ev,cfg,demo){

  if(demo){CARDS.slice().sort(()=>Math.random()-.5).slice(0,7).forEach(x=>cards[x.id]=Math.random()<.3?2:1)}
  else{
    let d=await Store.load();
    /* база не ответила — одна повторная попытка, чтобы не показать пустую коллекцию из-за сбоя сети */
    if(SB()&&Store.bad){await sleep(1500);d=await Store.load()}
    if(window.__say&&SB()&&Store.bad)window.__say('QX-cards: база не отвечает ('+Store.err+'), коллекция может быть неполной',true);
    const id=String(ev.user_id||''),lg=String(ev.user_login||'').toLowerCase(),nm=String(ev.user_name||'').toLowerCase();
    /* профиль ищем по id, логину и нику без учёта регистра; если он лежит под несколькими ключами, карточки объединяются (берётся большее число) */
    for(const k in (d.v||{})){const u=d.v[k];if(!u||!u.c)continue;
      if(k===id||String(k).toLowerCase()===lg||String(u.l||'').toLowerCase()===lg||String(u.n||'').toLowerCase()===nm||String(u.n||'').toLowerCase()===lg){
        for(const c in u.c)cards[c]=Math.max(+cards[c]||0,+u.c[c]||0)}}
  }
  enqueue({type:'col',cfg:cfg,c:{name:ev.user_name,cards:cards}});
}

async function initOverlay(){

  const LW=false,KW=H.get('w')==='luck',WID=RW?'rl':BW?'bet':LW?'lotto':KW?'luck':'main',useBT=BW||(!RW&&!LW&&!KW&&!NB),useLT=LW||(!RW&&!BW&&!KW&&!NB),useLK=KW||(!RW&&!BW&&!LW&&!NB),PROC=!RW&&!BW&&!LW&&!KW;

  let info;

  if(!isOwn(info.login)){say('QX-cards: доступ только для '+CONFIG.OWNERS.join(' и '),true,true);return}
  CH='quddix';window.__qxA={tok:tok,info:info};
  syncClock();
  (function(){const mid=cfg.pos==='l'||cfg.pos==='r',bsd=H.get('bs')==='l'?'tl':'tr',wa=cfg.pos==='l'?'c':'bc',leg={};
    if(BW){leg.bt={a:wa,s:cfg.scale};leg.bb={a:bsd,s:cfg.scale}}
    else if(KW)leg.lk={a:'c',s:cfg.scale}
    else{leg.pk={a:cfg.pos,s:cfg.scale};leg.bt={a:mid?'c':'bc',s:cfg.scale};leg.bb={a:bsd,s:cfg.scale};leg.lk={a:'c',s:.9}}
    layInit(leg)})();
  if(useBT)initBT(cfg,{side:H.get('bs')==='l'?'l':'r',say:say});
  if(useLK)initLK();
  const onRedeem=async ev=>{const ti=ev.reward.title.toLowerCase();
    if(BW){await bet(ev,ti);return}
    if(KW){await luckRedeem(ev,ti);return}
    if(useBT&&await bet(ev,ti))return;
    if(PROC&&await luckRedeem(ev,ti))return;
    if(reward2&&ti.includes(reward2)){handleCol(ev,cfg,false);return}const anyT=String(TITLES['*']||'').trim().toLowerCase();const gen=(anyT&&ti.trim()===anyT)||ti.includes(reward||'пак');const isTest=/(^|[^а-яёa-z])тест/.test(ti);const pk=byTitle(ti)||packFor(ti)||((gen||isTest)?randPack():null);if(pk)handleRedeem(ev,cfg,!isTest,undefined,pk)};
  const onStatus=(t,code)=>{
    if(t==='sub'){if(code===429)say('QX-cards: у Twitch лимит 3 подключения на один вход, а открыто больше. Закройте лишние источники в OBS и вкладки в браузере, я переподключусь сама',true,true);else if(code===202){say('QX-cards v12: подключено ✓'+(BW?' (рулетка на баллы)':LW?' (лото)':KW?' (удача)':RW?' (рулетка)':''));Store.check().then(r=>{if(SB()&&!r.ok)say('QX-cards: '+r.msg,true,true);else if(SB())setTimeout(()=>say('QX-cards: '+r.msg),4800)})}else say('QX-cards: не удалось подписаться на награды (код '+code+'). Скопируйте новую ссылку в панели',true,true)}
    else if(t==='retry')say('QX-cards: переподключение…',false,true);
    else if(t==='revoked')say('QX-cards: доступ отозван, скопируйте новую ссылку',true,true);
  };

     виджет удачи (только показ) слушают сами лишь если основной ссылки нет в сети */
  let stopL=null,subOk=false,fsaid=false;
  const hb=()=>{if(subOk&&PROC)kvSet('kd_hb_'+CH,{t:Date.now(),w:'main'})};
  const status=(t,code)=>{if(t==='sub'){subOk=(code===202);if(subOk)hb()}else if(t==='retry'||t==='limit'||t==='revoked')subOk=false;onStatus(t,code)};
  const startL=()=>listen(tok,info,onRedeem,status);
  if(!(LW||KW)){
    stopL=startL();
    if(PROC)setInterval(hb,20000);
  }else{
    const chk=async()=>{let fresh=false;try{const h=await kvGet('kd_hb_'+CH,null);fresh=!!(h&&Date.now()-h.t<75000)}catch(e){}
      if(fresh){if(stopL){stopL();stopL=null;subOk=false}if(!fsaid){fsaid=true;say('QX-cards: основная ссылка в сети, награды удачи принимает она, а этот виджет показывает результат ✓')}}
      else{fsaid=false;if(!stopL)stopL=startL()}};
    setTimeout(chk,4000);setInterval(chk,30000);
  }
  /* команды «Тест» из панели: каждый виджет берёт только свои и отвечает «получил» */
  const mine=ty=>WID==='bet'?ty==='bet':WID==='luck'?ty==='luck':(ty==='luck'&&useLK)||(ty==='pack'||ty==='col'||(ty==='bet'&&useBT));

  }catch(e){console.error(e)}};
  tp();setInterval(tp,2000);
  setInterval(()=>validate(tok).catch(()=>say('QX-cards: токен истёк — скопируйте новую ссылку в панели',true,true)),3600000);
}

/* Раунд лежит в kv: kd_bt_<канал>. Ставка = покупка награды, в названии которой есть ключевое слово раунда; цена награды добавляется к ставке зрителя.

const BTKEY=()=>'kd_bt_'+CH,BTHK=()=>'kd_bth_'+CH;
const kvGet=async(key,def)=>{if(SB()){try{const r=await fetch(CONFIG.SB_URL+'/rest/v1/kv?key=eq.'+encodeURIComponent(key)+'&select=value',{headers:SBH()});kvGet.err=r.ok?0:r.status;if(!r.ok)throw 0;const j=await r.json();return (j[0]&&j[0].value)||def}catch(e){if(!kvGet.err)kvGet.err=-1;return def}}return ls.get('kd:'+key,def)};
const kvSet=async(key,val)=>{ls.set('kd:'+key,val);if(SB()){try{const r=await fetch(CONFIG.SB_URL+'/rest/v1/kv',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},SBH()),body:JSON.stringify({key:key,value:val})});return r.ok}catch(e){return false}}return false};
/* время считает база: разница с часами компьютера учитывается, таймеры у всех совпадают */
let SKEW=0;

async function syncClock(){if(!SB())return;try{const t0=Date.now(),r=await rpc('qx_ping'),t1=Date.now();if(r&&r.now)SKEW=r.now-Math.round((t0+t1)/2)}catch(e){}}
const fmtT=ms=>{ms=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const fpc=n=>(Math.round(n*10)/10).toString().replace('.',',');
const hasBids=S=>Object.values((S&&S.bids)||{}).some(x=>x.s>0);
const btMax=sp=>((sp&&sp.secs)||30)*1000+((sp&&sp.order)||[]).length*3000+60000;
/* приз раунда: конкретная карточка или случайная из пака */
function btPrize(S){
  if(S&&S.card!=null&&byId(S.card)){const c=byId(S.card);return {card:c,name:c.name,c:RAR[c.r].c,s:RAR[c.r].l.toUpperCase()}}
  const pk=S&&PACKS.find(x=>x.id===S.pk);
  return {card:null,name:pk?'Случайная карточка · '+pk.name:'Карточка',c:'#ffc83a',s:'ПРИЗ'};
}

/* общая запись в kv с проверкой версии (нужна «Удаче») */
async function ltRead(key){
  const r=await fetch(CONFIG.SB_URL+'/rest/v1/kv?key=eq.'+encodeURIComponent(key)+'&select=value',{headers:SBH()});
  if(!r.ok)throw new Error('база: '+r.status);
  const j=await r.json();return (j[0]&&j[0].value)||null;
}
async function ltCas(mut,key){
  key=key;
  if(!SB())throw new Error('нужна подключённая база');
  for(let i=0;i<8;i++){
    const cur=await ltRead(key);
    const s=cur&&(cur.status||cur.title)?JSON.parse(JSON.stringify(cur)):null;
    const o=mut(s);
    if(!o||o.err)return o||{err:'x'};
    const ns=o.s;ns.rev=((cur&&cur.rev)||0)+1;
    let ok=false;
    if(cur&&typeof cur.rev==='number'){
      const r=await fetch(CONFIG.SB_URL+'/rest/v1/kv?key=eq.'+encodeURIComponent(key)+'&value->>rev=eq.'+cur.rev,{method:'PATCH',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=representation'},SBH()),body:JSON.stringify({value:ns})});
      if(!r.ok){ok=await kvSet(key,ns);if(!ok)throw new Error('база: '+r.status)}
      else{const j=await r.json();ok=Array.isArray(j)&&j.length>0}
    }else ok=await kvSet(key,ns);
    if(ok)return {ok:true,s:ns,res:o.res};
    await sleep(80+Math.random()*160);
  }
  throw new Error('база занята, повторите');
}
/* ============ УДАЧА: за баллы в профиль может выпасть Обычная или Редкая карточка, либо неудача ============ */
const LKKEY=()=>'kd_lk_'+CH;
async function lkPlay(ev,force){
  const w=who(ev);
  const out=await ltCas(s=>{
    if(!s||!s.on)return {err:'off'};
    if((s.seen||[]).includes(ev.id))return {err:'dup'};
    const now=nowS();s.used=s.used||{};
    let res,card=null;
    if(s.once&&s.used[w.id]&&!force)res='used';
    else{
      const c=s.ch,t=(+c.fail||0)+(+c.common||0)+(+c.rare||0);let r=Math.random()*t;
      res=r<c.fail?'fail':r<c.fail+c.common?'common':'rare';
      if(res!=='fail'){const pool=CARDS.filter(x=>x.r===res);if(pool.length)card=pool[Math.floor(Math.random()*pool.length)].id;else res='fail'}
      s.used[w.id]=now;
    }
    s.last={id:String(ev.id||('x'+now)),t:now,n:w.name,res:res,card:card};
    s.h=[{t:now,n:w.name,res:res,card:card,e:String(ev.id||''),r:String((ev.reward&&ev.reward.id)||''),u:w.id}].concat(s.h||[]).slice(0,40);if(ev.reward&&ev.reward.id)s.rid=String(ev.reward.id);
    s.seen=((s.seen||[]).concat([ev.id])).slice(-120);
    return {s:s,res:{res:res,card:card,user:w}};
  },LKKEY());
  if(out.ok&&out.res.res!=='used'){
    const c=out.res.card!=null?byId(out.res.card):null;
    for(let i=0;i<3;i++){
      try{await rpc('qx_grant',{p_ch:CH,p_id:w.id,p_login:w.login,p_name:w.name,p_card:c?c.id:null,p_total:false,p_buy:{n:w.name,w:'Удача',p:c?'«'+c.name+'»':'Неудача',c:c?RAR[c.r].c:'#8a8a8a',e:String(ev.id||''),r:String((ev.reward&&ev.reward.id)||''),u:w.id,cd:c?c.id:null}});break}
      catch(e){console.error('qx_grant',e.message);await sleep(700*(i+1))}
    }
  }
  return out;
}

/* ---- возврат баллов за «Удачу» (только по желанию стримера) ---- */
const TWH=(info,tok)=>({'Client-Id':info.client_id,Authorization:'Bearer '+tok,'Content-Type':'application/json'});
async function twRedeem(info,tok,rid,eid,status){
  try{
    const r=await fetch('https://api.twitch.tv/helix/channel_points/custom_rewards/redemptions?id='+encodeURIComponent(eid)+'&broadcaster_id='+info.user_id+'&reward_id='+encodeURIComponent(rid),{method:'PATCH',headers:TWH(info,tok),body:JSON.stringify({status:status})});
    if(r.ok)return true;
    const j=await r.json().catch(()=>({}));
    if(r.status===400)return 'покупка уже обработана (баллы уже возвращены или награда засчитана), в Twitch её больше не изменить';
    if(r.status===403)return 'эта награда создана не панелью. Вернуть баллы можно только вручную в Twitch, либо создайте награду кнопкой «Создать награду на Twitch»';
    if(r.status===401)return 'вход устарел: откройте ссылку панели заново';
    if(r.status===404)return 'покупки уже нет в очереди Twitch';
    return String(j.message||('код '+r.status));
  }catch(e){return e.message}
}
async function lkMark(eids,state,reset){
  try{const r=await rpc('qx_lk_mark',{p_ch:CH,p_eids:eids,p_state:state,p_reset:!!reset});if(r&&r.ok!==false)return r}catch(e){}
  const set=new Set(eids);
  return await ltCas(s=>{if(!s)return {err:'none'};
    s.h=(s.h||[]).map(x=>{if(x.e&&set.has(x.e)&&!x.rf){const y=Object.assign({},x);
      if(state==='done')y.fl=1;else{y.rf=1;if(reset&&y.u&&['fail','common','rare'].indexOf(y.res)>=0&&s.used)delete s.used[y.u]}
      return y}return x});
    return {s:s}},LKKEY());
}

        ok=sep?okW:okM,G='<b style="color:#7dffb0">',R='<b style="color:#ff8a8a">';
      el.innerHTML=(sep?'Режим: отдельные виджеты. ':'Режим: всё в основной ссылке. ')+
        (ok?G+'✓ '+(sep?'Виджет «Удача»':'Основная ссылка')+' в OBS в сети, удача покажется</b>':R+'✗ '+(sep?'Виджет «Удача»':'Основная ссылка')+' в OBS не найден.</b> '+(sep?'Добавьте источник «Браузер» со ссылкой выше':'Добавьте или обновите основную ссылку из раздела «Оверлей»')+' (или нажмите у источника «Обновить кэш браузера»). Покупки при этом засчитываются, но показать их некому.')}
    catch(e){}};
  $('#lkcp').onclick=async()=>{const v=lnk();try{await navigator.clipboard.writeText(v)}catch(e){$('#lklink').select();document.execCommand('copy')}$('#lkcp').textContent='Скопировано ✓';setTimeout(()=>$('#lkcp').textContent='Копировать',1800)};
  chkW();setInterval(chkW,5000);
  $('#lkchk').onclick=async()=>{const o=[];
    if(!SB()){msg('Нет подключённой базы: вкладка «Профили» → адрес проекта и ключ');return}
    try{const a=await ltRead(LKKEY());o.push('чтение базы ✓');o.push(a&&a.title?(a.on?'удача включена':'удача ВЫКЛЮЧЕНА, нажмите «Сохранить и включить»'):'удача не настроена, нажмите «Сохранить и включить»');
      if(a&&a.title){const r=await ltCas(s=>s?{s:s}:{err:'none'},LKKEY());o.push(r.ok?'запись ✓':'запись не прошла')}}
    catch(e){o.push('ОШИБКА: '+(e.message||e))}
    msg(o.join(' · '))};
  $('#lkreal').onclick=async()=>{if(!need())return;msg('Пробую…');
    try{const x=await lkPlay({id:'self-'+Date.now(),user_id:String(info.user_id),user_login:info.login,user_name:info.display_name||info.login,reward:{title:LS.kw,cost:0}},true);
      if(x.err){msg(x.err==='off'?'Удача выключена или не настроена: нажмите «Сохранить и включить»':'Не вышло ('+x.err+')');return}
      A=x.s;draw();msg('Результат: '+lkLine(x.res)+(x.res.res==='fail'?'':' ✓ записано в вашу коллекцию')+'. OBS покажет его за пару секунд')}
    catch(e){msg('ОШИБКА: '+(e.message||e))}};
  $('#lkmk').onclick=async()=>{msg('Включаю и создаю…');await save(true);const r=await mk(info,tok,{title:LS.kw.charAt(0).toUpperCase()+LS.kw.slice(1),cost:LS.cost,prompt:'Шанс получить Обычную или Редкую карточку в профиль. Чаще всего — неудача.',color:'#8a8a8a',once:LS.once,queue:LS.rf});msg(r===true?'Награда создана ✓'+(LS.rf?' Покупки будут ждать в очереди Twitch, баллы можно вернуть выборочно.':''):'Не вышло: '+r)};

  /* возврат баллов выбранному зрителю */
  root.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-rf]');if(!b)return;
    const id=b.getAttribute('data-rf'),x=((A&&A.h)||[]).find(z=>z.e===id);if(!x||!x.r)return;
    b.disabled=true;msg('Возвращаю баллы: '+x.n+'…');
    const r=await twRedeem(info,tok,x.r,x.e,'CANCELED');
    if(r!==true){b.disabled=false;msg('Не вернул ('+x.n+'): '+r);return}
    try{await lkMark([x.e],'refund',LS.rst)}catch(err){console.error(err)}
    try{const rs=ls.get('kd:rfs',{});const u=await rdUndo([x.e],rs.take);await rfLog({n:x.n,w:'Удача',c:0,k:'rf',took:(u&&u.took)||0,unb:0})}catch(err){}
    msg('Баллы возвращены: '+x.n+' ✓'+(LS.rst?' Он может снова использовать награду.':''));load()});
  const pend=f=>((A&&A.h)||[]).filter(x=>x.e&&x.r&&!x.rf&&!x.fl&&(!f||f(x)));
  const bulk=async(list,status,state,okTxt)=>{let ok=[],bad=0,why='';
    for(const x of list){const r=await twRedeem(info,tok,x.r,x.e,status);if(r===true)ok.push(x.e);else{bad++;why=r}await sleep(180)}
    if(ok.length){try{await lkMark(ok,state,LS.rst)}catch(err){console.error(err)}}
    msg(okTxt+': '+ok.length+(bad?', не вышло: '+bad+' ('+why+')':''));load()};
  $('#lkrfail').onclick=()=>{const l=pend(x=>x.res==='fail');if(!l.length){msg('Нет покупок с неудачей, ожидающих в очереди Twitch');return}
    if(!confirm('Вернуть баллы '+l.length+' зрителям, у которых выпала неудача?'))return;msg('Возвращаю…');bulk(l,'CANCELED','refund','Баллы возвращены')};
  $('#lkdone').onclick=()=>{const l=pend();if(!l.length){msg('В очереди Twitch нечего закрывать');return}
    if(!confirm('Засчитать '+l.length+' покупок (баллы остаются у вас, вернуть их потом будет нельзя)?'))return;msg('Закрываю очередь…');bulk(l,'FULFILLED','done','Засчитано')};
  $('#lkapply').onclick=async()=>{msg('Ищу награду на Twitch…');
    try{const r=await fetch('https://api.twitch.tv/helix/channel_points/custom_rewards?broadcaster_id='+info.user_id+'&only_manageable_rewards=true',{headers:TWH(info,tok)});const j=await r.json().catch(()=>({}));
      if(!r.ok){msg('Не вышло: '+(j.message||r.status));return}
      const t=String(LS.kw).toLowerCase(),rw=(j.data||[]).find(z=>String(z.title).toLowerCase().indexOf(t)>=0);
      if(!rw){msg('Награды со словом «'+LS.kw+'» среди созданных панелью нет. Удалите старую награду в Twitch и создайте новую кнопкой «Создать награду на Twitch» (она сразу будет с возвратом)');return}
      const p=await fetch('https://api.twitch.tv/helix/channel_points/custom_rewards?broadcaster_id='+info.user_id+'&id='+rw.id,{method:'PATCH',headers:TWH(info,tok),body:JSON.stringify({should_redemptions_skip_request_queue:!LS.rf})});
      const pj=await p.json().catch(()=>({}));
      msg(p.ok?(LS.rf?'Готово ✓ Новые покупки будут ждать в очереди Twitch, баллы можно вернуть выборочно':'Готово ✓ Очередь отключена, покупки засчитываются сразу'):'Не вышло: '+(pj.message||p.status))}
    catch(err){msg('Ошибка: '+(err.message||err))}};
  setInterval(()=>{if(!root.hidden)load()},3000);
  LKUI={refresh:load};
}

/* ============ публичная страница профилей: вписал ник — увидел все карточки ============ */
async function renderProfile(){
  CH='quddix';
  const app=$('#app');
  app.innerHTML='<header class="top"><span class="logo"><i></i>QX-cards</span><span class="usr">Профили зрителей'+(CH?' · '+esc(CH):'')+'</span></header>'+
   '<main class="wrap"><div class="panel"><h3>Найти профиль</h3><p class="hint">Впишите ник на Twitch: покажем все карточки, которые у зрителя есть, и историю его выигрышей.</p>'+
   '<label class="f">Ник зрителя<input class="in" id="pq" list="pl" placeholder="например, quddix" maxlength="40" autocomplete="off"></label><datalist id="pl"></datalist><div class="chips" id="ptop"></div></div>'+
   '<div class="panel" id="pres" hidden></div></main>';
  if(!CH||!SB()){$('#pres').hidden=false;$('#pres').innerHTML='<p class="warn" style="margin:0">Ссылка неполная: нужна ссылка на страницу профилей из панели стримера.</p>';return}
  const D=await Store.load();
  if(Store.err&&Store.bad){$('#pres').hidden=false;$('#pres').innerHTML='<p class="warn" style="margin:0">Не удалось загрузить данные: '+esc(Store.err)+'</p>';return}
  const vs=Object.keys(D.v||{}),cnt=l=>Object.keys(D.v[l].c||{}).length;
  $('#pl').innerHTML=vs.map(l=>'<option value="'+esc(D.v[l].n)+'">').join('');
  const top=vs.slice().sort((a,b)=>cnt(b)-cnt(a)).slice(0,10);
  $('#ptop').innerHTML=top.map(l=>'<button class="chip" data-l="'+esc(l)+'">'+esc(D.v[l].n)+' · '+cnt(l)+'/'+CARDS.length+'</button>').join('');
  const show=l=>{
    const u=D.v[l],pr=$('#pres'),have=cnt(l);pr.hidden=false;
    const hist=(u.h||[]).slice(0,12).map(x=>'<div><time>'+new Date(x.t).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+'</time><span>'+esc(x.w)+': <b>'+esc(x.p)+'</b></span></div>').join('');
    pr.innerHTML='<h3>'+esc(u.n)+'</h3><div class="prog"><div class="bar"><span style="width:'+(have/CARDS.length*100)+'%"></span></div><span>'+have+' из '+CARDS.length+'</span>'+(have===CARDS.length?'<span class="full">ФУЛЛ</span>':'')+'</div>'+
      '<div class="cards">'+gridHTML(c=>tileHTML(c,{lock:!(u.c||{})[c.id],n:(u.c||{})[c.id]||0}))+'</div>'+
      (hist?'<h3 style="margin-top:20px">Как получал карточки</h3><div class="log">'+hist+'</div>':'');
  };
  const find=q=>{q=q.trim().toLowerCase();if(!q)return null;let part=null;
    for(const l of vs){const n=(D.v[l].n||'').toLowerCase(),lg=(D.v[l].l||'').toLowerCase();if(l===q||n===q||lg===q)return l;if(!part&&(n.includes(q)||lg.includes(q)))part=l}return part};
  $('#pq').oninput=e=>{const q=e.target.value;if(!q.trim()){$('#pres').hidden=true;return}const l=find(q);
    if(l)show(l);else{$('#pres').hidden=false;$('#pres').innerHTML='<p class="hint" style="margin:0">Зритель «'+esc(q.trim())+'» пока не найден: у него ещё нет карточек.</p>'}};
  document.querySelectorAll('#ptop .chip').forEach(b=>b.onclick=()=>{$('#pq').value=D.v[b.dataset.l].n;show(b.dataset.l)});
}

/* ============ виджет: кто что купил ============ */
const buyHTML=(x,nw)=>'<div'+(nw?' class="nw"':'')+' style="--c:'+esc(x.c||'#ff5a4d')+'"><b>'+esc(x.n)+'</b><small>'+esc(x.w)+' → <span style="color:'+esc(x.c||'#fff')+'">'+esc(x.p)+'</span></small></div>';
async function initFeed(){
  document.body.classList.add('ov');
  CH='quddix';
  layInit({fd:{a:H.get('p')==='l'?'tl':'tr',s:parseFloat(H.get('s'))||1}});
  const n=Math.min(15,Math.max(3,+H.get('n')||8)),host=$('#host'),st=$('#st');
  host.innerHTML='<div class="feed"></div>';
  const say=(t,bad)=>{st.hidden=false;st.className=bad?'bad':'';st.textContent=t;if(!bad)setTimeout(()=>{st.hidden=true},5000)};
  if(!CH||!SB()){say('QX-cards: ленте нужна подключённая база и ник канала — скопируйте ссылку в панели',true);return}
  const box=$('.feed',host);layPlace(box,'fd');let last=-1,shown=false;
  say('QX-cards: лента подключена, покупки появятся здесь');
  const tick=async()=>{try{const D=await Store.load();if(Store.bad){say('QX-cards: лента — ошибка базы: '+Store.err,true);return}if(!shown){shown=true;st.hidden=true}const L=(D.buy||[]).slice(0,n),top=L[0]?L[0].t:0;if(top===last)return;const old=last;last=top;box.innerHTML=L.map(x=>buyHTML(x,old>0&&x.t>old)).join('')}catch(e){}};
  tick();setInterval(tick,4000);
}

/* ============ старт ============ */
(async function main(){
  if(OV)return H.get('w')==='feed'?initFeed():initOverlay();
  if(H.get('v')==='1')return renderProfile();
    if(new URLSearchParams(location.hash.slice(1)).get('demo')==='1')return renderDash('DEMO',{login:CONFIG.OWNER,display_name:'Демо (без входа)',user_id:'0',client_id:'',expires_in:0},true);
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){
    if(h.get('state')&&h.get('state')===sessionStorage.getItem('kd:st')){ls.set('kd:tok',h.get('access_token'));sessionStorage.removeItem('kd:tried')}
    history.replaceState(null,'',location.pathname+location.search);
  }
  const tok=ls.get('kd:tok',null);
  const tried=()=>sessionStorage.getItem('kd:tried');
  if(!tok){if(!tried())return goLogin();return renderLogin(tried()?'Вход не выполнен, попробуйте ещё раз.':'')}
  let info;
  try{info=await validate(tok)}catch(e){localStorage.removeItem('kd:tok');if(!tried())return goLogin();return renderLogin('Сессия истекла, войдите заново.')}
  const lg=info.login.toLowerCase(),isOwner=isOwn(lg);
  if(!isOwner&&!CONFIG.MODS.some(x=>x.toLowerCase()===lg))return renderDenied(info);
  if(!(info.scopes||[]).includes('channel:manage:redemptions')){localStorage.removeItem('kd:tok');if(!tried())return goLogin();return renderLogin('Не хватает прав на награды, войдите заново.')}
  if(!isOwner){
    const ot=ls.get('kd:otok',null);
    if(ot){try{const oi=await validate(ot);if(isOwn(oi.login)&&(oi.scopes||[]).includes('channel:manage:redemptions'))return renderDash(ot,oi,true,(info.display_name||info.login)+' (модератор)')}catch(e){localStorage.removeItem('kd:otok')}}
  }
  renderDash(tok,info,isOwner);
})();
</script>
