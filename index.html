<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>QX-cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0506;--ink:#fff3ef;--mute:#b99b97;--bd:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05);--red:#ff2d3a;--hot:#ff5a4d;--f:'Onest','Segoe UI',system-ui,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body:not(.ov)::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 8% -6%,rgba(255,45,58,.34),transparent),radial-gradient(520px 380px at 96% 4%,rgba(255,122,61,.2),transparent)}
body.ov{background:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
code{font:500 13px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:7px;word-break:break-all}
:focus-visible{outline:3px solid #ffc46b;outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* общие */
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb1a3,var(--red) 55%,#7a0a14);box-shadow:0 0 18px rgba(255,45,58,.9)}
.logo.big{font-size:34px}.logo.big i{width:32px;height:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;padding:14px 28px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn.p{background:linear-gradient(180deg,#ff5a4d,var(--red));color:#fff;box-shadow:0 10px 34px rgba(255,45,58,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.p:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 42px rgba(255,45,58,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.g{background:var(--glass);border-color:var(--bd)}.btn.g:hover{background:rgba(255,255,255,.1)}
.btn.s{padding:9px 18px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.warn{color:#ffb4a8;font-size:14px}

/* вход */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(460px,100%);text-align:center;padding:42px 32px;border-radius:28px;background:rgba(255,255,255,.04);border:1px solid var(--bd);backdrop-filter:blur(14px);display:grid;gap:18px;justify-items:center}
.login p{color:#d8bcb7}.login small{color:var(--mute);font-size:13px}

/* панель */
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--bd);background:rgba(18,8,10,.6);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.top .usr{margin-left:auto;color:var(--mute);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 22px 80px}
.tabs{display:flex;gap:6px;margin-bottom:22px;padding:5px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);width:fit-content}
.tabs button{border:0;background:none;padding:9px 22px;border-radius:99px;color:var(--mute);font-weight:600;cursor:pointer}
.tabs button.on{background:linear-gradient(180deg,#ff5a4d,var(--red));color:#fff}
.panel{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:18px}
.panel h3{font-size:18px;margin-bottom:6px}.panel .hint{color:var(--mute);font-size:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mute);font-weight:500}
.in{width:100%;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--bd);color:var(--ink)}
select.in option{background:#1a0d10}
.copy{display:flex;gap:8px}.copy .in{font:500 13px ui-monospace,Consolas,monospace}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mute);font-weight:500;font-size:13px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;transform:rotate(45deg);margin-right:9px;vertical-align:-1px}

/* коллекция */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1 1 150px;padding:16px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--bd)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
.tile{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:284/408;background:#120a0c;box-shadow:0 0 0 1px var(--rc),0 0 22px var(--rca)}
.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:filter .3s}
.tile.lock{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tile.lock img{filter:grayscale(1) brightness(.2)}
.tile .q{position:absolute;inset:0;display:grid;place-items:center;font:800 44px var(--f);color:rgba(255,255,255,.22)}
.tile .n{position:absolute;top:8px;right:8px;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.72);font-weight:800;font-size:13px}
.tc{margin-top:7px;text-align:center;font-size:13px;color:var(--mute)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.prog .bar{flex:1 1 200px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.prog .bar span{display:block;height:100%;background:linear-gradient(90deg,#ff5a4d,#ffc83a)}
.full{padding:3px 12px;border-radius:99px;background:linear-gradient(90deg,#ffc83a,#ff9466);color:#2a1300;font-weight:800;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--bd);background:var(--glass);border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer}.chip:hover{background:rgba(255,255,255,.1)}
.log{display:grid;gap:6px;font-size:14px;color:#d8bcb7}.log div{display:flex;gap:10px}.log time{color:var(--mute);min-width:44px}

/* оверлей */
#st{position:fixed;left:12px;top:12px;z-index:99;padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.72);font:600 13px var(--f);color:#fff}
#st.bad{background:rgba(180,20,30,.9)}
.stage{position:fixed;width:440px;height:720px;z-index:10;pointer-events:none}
.stage.bl{left:1.5vw;bottom:0;transform:scale(var(--s));transform-origin:left bottom}
.stage.br{right:1.5vw;bottom:0;transform:scale(var(--s));transform-origin:right bottom}
.stage.bc{left:50%;bottom:0;transform:translateX(-50%) scale(var(--s));transform-origin:center bottom}
.stage.l{left:1.5vw;top:50%;transform:translateY(-50%) scale(var(--s));transform-origin:left center}
.stage.r{right:1.5vw;top:50%;transform:translateY(-50%) scale(var(--s));transform-origin:right center}
.pack{position:absolute;left:110px;top:330px;width:220px;height:320px;z-index:3;filter:drop-shadow(0 18px 26px rgba(0,0,0,.65))}
.pbody,.ptop{position:absolute;left:0;width:220px}
.ptop{top:0;height:52px;background:linear-gradient(180deg,#5a2aae,#33156b)}
.ptop::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 6px)}
.pbody{top:52px;height:268px;overflow:hidden;background:linear-gradient(160deg,#3a1b78,#160a2c 55%,#3d1248);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.pbody b{font:800 31px/.95 var(--f);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffb6c0);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.pbody small{font:700 11px var(--f);letter-spacing:.18em;color:#d9c4ff;position:relative}
.gems{display:flex;gap:14px;position:relative;margin-bottom:4px}
.gems u{display:block;width:16px;height:16px;border-radius:3px;transform:rotate(45deg);background:var(--g);box-shadow:0 0 14px var(--g)}
.shine{position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);transform:skewX(-18deg);animation:sh 2.2s linear infinite}
@keyframes sh{to{left:140%}}
.card{position:absolute;left:110px;top:330px;width:220px;height:316px;z-index:2;opacity:0;border-radius:14px;overflow:hidden;transform:translateY(20px) scale(.55);box-shadow:0 0 50px var(--rc),0 20px 40px rgba(0,0,0,.6)}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.rays{position:absolute;left:220px;top:250px;width:760px;height:760px;margin:-380px 0 0 -380px;z-index:1;opacity:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--rca) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 66%);mask:radial-gradient(circle,#000 0,transparent 66%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{position:absolute;left:220px;top:490px;width:420px;height:420px;border-radius:50%;z-index:4;opacity:0;background:radial-gradient(circle,#fff 0,var(--rc) 45%,transparent 70%);mix-blend-mode:screen}
.sparks{position:absolute;left:220px;top:250px;width:0;height:0;z-index:4}
.sparks span{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen}
.cap{position:absolute;left:-20px;right:-20px;top:664px;text-align:center;z-index:5;opacity:0;text-shadow:0 2px 10px #000,0 0 24px rgba(0,0,0,.85)}
.cap .nm{font:800 30px/1.15 var(--f);overflow-wrap:anywhere}
.cap .rl{font:800 15px var(--f);letter-spacing:.32em}
.cap .sb{font:600 16px var(--f);color:#ffe9e4;margin-top:6px}
.cap .cn{font:600 15px var(--f);color:#ffe9e4;opacity:.85}
.tg{font-weight:800;padding:2px 11px;border-radius:99px;background:rgba(0,0,0,.6)}
.tg.n{color:#7dffa0}.tg.f{color:#ffd45a}.tg.d{color:#ffb7ab}.tg.t{color:#b9b9b9}
.cap .bar{width:220px;height:6px;border-radius:9px;background:rgba(255,255,255,.2);margin:11px auto 0;overflow:hidden}
.cap .bar span{display:block;height:100%;border-radius:9px;background:var(--rc);box-shadow:0 0 12px var(--rc)}
</style>
</head>

/* ============ рандом ============ */
function roll(force){
  const R=CONFIG.CHANCES;let rar=force;
  if(!rar){let t=0;ORDER.forEach(k=>t+=R[k]);let x=Math.random()*t;rar='common';
    for(const k of ORDER){if(x<R[k]){rar=k;break}x-=R[k]}}
  const pool=CARDS.filter(c=>c.r===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ============ хранилище коллекции ============ */
const empty=()=>({v:{},g:{},total:0,log:[]});
const Store={
  async load(){
    if(SB()){try{const r=await fetch(CONFIG.SB_URL+'/rest/v1/kv?key=eq.kd_data&select=value',{headers:SBH()});const j=await r.json();if(j[0]&&j[0].value)return Object.assign(empty(),j[0].value);return empty()}catch(e){}}
    return Object.assign(empty(),ls.get('kd:data',null)||{});
  },
  async save(d){
    ls.set('kd:data',d);
    if(SB()){try{await fetch(CONFIG.SB_URL+'/rest/v1/kv',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},SBH()),body:JSON.stringify({key:'kd_data',value:d})})}catch(e){}}
  }
};
function applyPull(d,login,name,card){
  const u=d.v[login]||(d.v[login]={n:name,c:{}});
  u.n=name;const prev=u.c[card.id]||0;u.c[card.id]=prev+1;
  d.g[card.id]=(d.g[card.id]||0)+1;d.total++;
  d.log.unshift({l:login,n:name,c:card.id,t:Date.now()});d.log.length=Math.min(d.log.length,40);
  const have=Object.keys(u.c).length;
  return {isNew:prev===0,count:prev+1,have:have,full:prev===0&&have===CARDS.length};
}

/* ============ Twitch ============ */
async function validate(tok){
  const r=await fetch('https://id.twitch.tv/oauth2/validate',{headers:{Authorization:'OAuth '+tok}});
  if(!r.ok)throw new Error('token');return r.json();
}
function listen(tok,info,onRedeem,onStatus){
  let ws,wd,dead=false,ka=10;const seen=new Set();
  const arm=()=>{clearTimeout(wd);wd=setTimeout(()=>{try{ws.close()}catch(e){}},(ka+8)*1000)};
  async function sub(sid){
    const r=await fetch('https://api.twitch.tv/helix/eventsub/subscriptions',{method:'POST',headers:{'Client-Id':info.client_id,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({type:'channel.channel_points_custom_reward_redemption.add',version:'1',condition:{broadcaster_user_id:info.user_id},transport:{method:'websocket',session_id:sid}})});
    return r.status;
  }
  function open(url,re){
    const sock=new WebSocket(url);ws=sock;
    sock.onmessage=async ev=>{
      const m=JSON.parse(ev.data),t=m.metadata.message_type;arm();
      if(t==='session_welcome'){ka=m.payload.session.keepalive_timeout_seconds||10;arm();if(!re)onStatus('sub',await sub(m.payload.session.id))}
      else if(t==='session_reconnect'){open(m.payload.session.reconnect_url,true);setTimeout(()=>{try{sock.close()}catch(e){}},1500)}
      else if(t==='notification'){if(seen.has(m.metadata.message_id))return;seen.add(m.metadata.message_id);onRedeem(m.payload.event)}
      else if(t==='revocation'){onStatus('revoked')}
    };
    sock.onclose=()=>{if(dead||ws!==sock)return;onStatus('retry');setTimeout(()=>open('wss://eventsub.wss.twitch.tv/ws',false),3000)};
  }
  open('wss://eventsub.wss.twitch.tv/ws',false);
  return ()=>{dead=true;clearTimeout(wd);try{ws.close()}catch(e){}};
}

/* ============ анимация пака ============ */
const queue=[];let busy=false;
function enqueue(j){queue.push(j);if(!busy)runQ()}
async function runQ(){busy=true;while(queue.length){try{await play(queue.shift())}catch(e){console.error(e)}}busy=false}

function zig(w,h,t,n,top){
  const p=[],s=w/n;
  if(top){for(let i=0;i<=n;i++)p.push((i*s)+'px '+(i%2?0:t)+'px');p.push(w+'px '+h+'px','0px '+h+'px')}
  else{p.push('0px 0px',w+'px 0px');for(let i=n;i>=0;i--)p.push((i*s)+'px '+(i%2?h:h-t)+'px')}
  return 'polygon('+p.join(',')+')';
}
function stageHTML(cfg){
  return '<div class="stage '+cfg.pos+'" style="--s:'+cfg.scale+'"><div class="rays"></div><div class="flash"></div><div class="sparks"></div>'+
  '<div class="card"><img alt=""></div>'+
  '<div class="pack"><div class="pbody"><i class="shine"></i><div class="gems"><u style="--g:#3ddc4a"></u><u style="--g:#3d8bff"></u><u style="--g:#ff2d4a"></u><u style="--g:#ffc83a"></u></div><b>QX<br>CARDS</b><small>ПАК · 1 КАРТОЧКА</small></div><div class="ptop"></div></div>'+
  '<div class="cap"></div></div>';
}
function burst(box,color,n,gold){
  for(let i=0;i<n;i++){
    const s=document.createElement('span'),a=Math.random()*6.283,d=120+Math.random()*(gold?440:300),z=3+Math.random()*(gold?9:6);
    s.style.cssText='width:'+z+'px;height:'+z+'px;background:'+(gold&&Math.random()<.5?'#fff2b0':color)+';box-shadow:0 0 '+(z*2)+'px '+color;
    box.appendChild(s);
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+60)+'px) scale(0)',opacity:0}],
      {duration:900+Math.random()*900,delay:Math.random()*150,easing:'cubic-bezier(.1,.7,.3,1)',fill:'both'}).finished.then(()=>s.remove());
  }
}
function screenFlash(color,op){
  const f=document.createElement('div');
  f.style.cssText='position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle at 50% 60%,#fff 0,'+color+' 55%,transparent 100%)';
  document.body.appendChild(f);
  f.animate([{opacity:0},{opacity:op,offset:.2},{opacity:0}],{duration:900}).finished.then(()=>f.remove());
}
async function play(job){
  const card=job.card,res=job.res,name=job.name,cfg=job.cfg,rar=RAR[card.r],big=card.r==='legendary',epic=card.r==='epic';
  const host=$('#host');host.insertAdjacentHTML('beforeend',stageHTML(cfg));
  const st=host.lastElementChild;
  st.style.setProperty('--rc',rar.c);st.style.setProperty('--rca',rgba(rar.c,.6));
  const pack=$('.pack',st),ptop=$('.ptop',st),pbody=$('.pbody',st),cardEl=$('.card',st),rays=$('.rays',st),flash=$('.flash',st),cap=$('.cap',st),sparks=$('.sparks',st);
  ptop.style.clipPath=zig(220,52,9,14,true);pbody.style.clipPath=zig(220,268,9,14,false);
  $('img',cardEl).src=card.src;
  cap.innerHTML='<div class="nm">'+esc(name)+'</div><div class="sb">открывает пак…</div>';
  const side=cfg.pos==='l'||cfg.pos==='r',dx=cfg.pos==='l'?-520:cfg.pos==='r'?520:0,dy=side?0:560;
  pack.animate([{transform:'translate('+dx+'px,'+dy+'px) rotate('+(dx?(dx<0?-14:14):-10)+'deg)',opacity:0},{transform:'none',opacity:1}],{duration:800,easing:'cubic-bezier(.2,1.15,.3,1)',fill:'both'});
  cap.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:500,delay:400,fill:'both'});
  await sleep(950);
  /* тряска */
  const N=24,T=big?2700:1800,kf=[];
  for(let i=0;i<=N;i++){const k=i/N,a=2+k*k*11;
    kf.push({transform:'translate('+((Math.random()-.5)*a*1.6)+'px,'+((Math.random()-.5)*a)+'px) rotate('+((Math.random()-.5)*a*.9)+'deg) scale('+(1+k*.06)+')',filter:'brightness('+(1+k*.9)+') drop-shadow(0 18px 26px rgba(0,0,0,.65))'})}
  await pack.animate(kf,{duration:T,easing:'linear',fill:'both'}).finished;
  /* разрыв */
  flash.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.2)'},{opacity:1,offset:.25},{opacity:0,transform:'translate(-50%,-50%) scale(3)'}],{duration:big?900:560,fill:'both'});
  if(big||epic)screenFlash(rar.c,big?.45:.25);
  ptop.animate([{transform:'none',opacity:1},{transform:'translate(70px,-170px) rotate(38deg)',opacity:0}],{duration:650,easing:'ease-out',fill:'both'});
  cardEl.style.opacity=1;
  rays.animate([{opacity:0},{opacity:big?.9:.55}],{duration:600,delay:200,fill:'both'});
  burst(sparks,rar.c,big?80:epic?44:card.r==='rare'?28:16,big);
  cardEl.animate([{transform:'translateY(20px) scale(.55)'},{transform:'translateY(-238px) scale(1.4)'}],{duration:1100,easing:'cubic-bezier(.17,1.2,.3,1)',fill:'both'});
  await sleep(450);
  pack.animate([{transform:'scale(1.06)',opacity:1},{transform:'translateY(190px) rotate(6deg) scale(.95)',opacity:0}],{duration:800,easing:'ease-in',fill:'both'});
  await sleep(800);
  /* подпись */
  if(res.full){burst(sparks,'#ffc83a',90,true);screenFlash('#ffc83a',.4)}
  const tag=res.test?'<span class="tg t">ТЕСТ — не сохраняется</span>':res.full?'<span class="tg f">ФУЛЛ КОЛЛЕКЦИЯ!</span>':res.isNew?'<span class="tg n">НОВАЯ</span>':'<span class="tg d">Повтор ×'+res.count+'</span>';
  cap.style.top='505px';
  cap.innerHTML='<div class="rl" style="color:'+rar.c+'">'+rar.l.toUpperCase()+'</div><div class="nm">'+esc(name)+'</div><div class="cn">«'+esc(card.name)+'»</div>'+
    '<div class="sb">'+tag+(res.test?'':' · коллекция '+res.have+'/'+CARDS.length)+'</div>'+
    (res.test?'':'<div class="bar"><span style="width:'+(res.have/CARDS.length*100)+'%"></span></div>');
  cap.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:500,fill:'both'});
  await sleep((big?7500:5200)+(res.full?3500:0));
  await st.animate([{opacity:1},{opacity:0}],{duration:600,fill:'both'}).finished;
  st.remove();
}
async function handleRedeem(ev,cfg,save,force){
  const card=roll(force);let res;
  if(save){const d=await Store.load();res=applyPull(d,ev.user_login,ev.user_name,card);await Store.save(d)}
  else res={isNew:true,count:1,have:1,full:false,test:true};
  enqueue({name:ev.user_name,card:card,res:res,cfg:cfg});
}

/* ============ режим оверлея (OBS) ============ */
async function initOverlay(){
  document.body.classList.add('ov');
  const st=$('#st');
  const say=(t,bad,keep)=>{st.hidden=false;st.className=bad?'bad':'';st.textContent=t;if(!keep)setTimeout(()=>st.hidden=true,4500)};
  const tok=H.get('t'),cfg={pos:H.get('p')||'bl',scale:parseFloat(H.get('s'))||.85},reward=(H.get('r')||'').toLowerCase();
  say('QX-cards: подключение…',false,true);
  let info;
  try{info=await validate(tok)}catch(e){say('QX-cards: токен недействителен — откройте панель и скопируйте новую ссылку',true,true);return}
  if(info.login.toLowerCase()!==CONFIG.OWNER.toLowerCase()){say('QX-cards: доступ только для '+CONFIG.OWNER,true,true);return}
  listen(tok,info,ev=>{if(reward&&!ev.reward.title.toLowerCase().includes(reward))return;handleRedeem(ev,cfg,true)},(t,code)=>{
    if(t==='sub'){if(code===202)say('QX-cards: подключено ✓');else say('QX-cards: не удалось подписаться на награды (код '+code+'). Скопируйте новую ссылку в панели',true,true)}
    else if(t==='retry')say('QX-cards: переподключение…',false,true);
    else if(t==='revoked')say('QX-cards: доступ отозван, скопируйте новую ссылку',true,true);
  });
  setInterval(()=>validate(tok).catch(()=>say('QX-cards: токен истёк — скопируйте новую ссылку в панели',true,true)),3600000);
}

function pct(){const R=CONFIG.CHANCES;let t=0;ORDER.forEach(k=>t+=R[k]);const o={};ORDER.forEach(k=>o[k]=R[k]/t*100);return o}
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',');

function tileHTML(c,o){
  const lock=o.lock;
  return '<div><div class="tile'+(lock?' lock':'')+'" style="--rc:'+RAR[c.r].c+';--rca:'+rgba(RAR[c.r].c,.35)+'"><img alt="" src="'+c.src+'">'+

}

    }else{
      $('#pg').innerHTML='<span style="color:var(--mute)">Все '+CARDS.length+' карточек пака. Число — сколько раз выпала у зрителей.</span>';
      $('#gr').innerHTML=CARDS.map(c=>tileHTML(c,{lock:false,n:D.g[c.id]||0})).join('');
    }
  }
  $('#vq').oninput=e=>{const l=pick(e.target.value);if(l!==null){sel=l;drawGrid()}};
  drawGrid();
}

/* ============ старт ============ */
(async function main(){
  if(OV)return initOverlay();
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){
    if(h.get('state')&&h.get('state')===sessionStorage.getItem('kd:st')){ls.set('kd:tok',h.get('access_token'));sessionStorage.removeItem('kd:tried')}
    history.replaceState(null,'',location.pathname+location.search);
  }
  const tok=ls.get('kd:tok',null);
  const tried=()=>sessionStorage.getItem('kd:tried');
  if(!tok){if(!tried())return goLogin();return renderLogin(tried()?'Вход не выполнен, попробуйте ещё раз.':'')}
  let info;
  try{info=await validate(tok)}catch(e){localStorage.removeItem('kd:tok');if(!tried())return goLogin();return renderLogin('Сессия истекла, войдите заново.')}
  if(info.login.toLowerCase()!==CONFIG.OWNER.toLowerCase())return renderDenied(info);
  if(!(info.scopes||[]).includes('channel:read:redemptions')){localStorage.removeItem('kd:tok');if(!tried())return goLogin();return renderLogin('Не хватает прав на награды, войдите заново.')}
  renderDash(tok,info);
})();
</script>
